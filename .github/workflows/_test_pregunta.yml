name: _TEST pregunta al grafo (temporal, borrar)

on:
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q -r requirements.txt
      - name: Preguntar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          python -X utf8 -c "
          from cerebro.grafo import descargar_si_falta, preguntar
          print('grafo bajado:', descargar_si_falta())
          for q in ['¿Qué le preocupa hoy a Bayer en Perú?',
                    '¿Qué se ha discutido en las sesiones sobre medicamentos o salud?']:
              print('RESPUESTA >>>', q); print(preguntar(q)); print('<<< FIN')
          " 2>&1 | grep -v "^INFO"
