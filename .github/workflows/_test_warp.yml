name: TEST - WARP proxy vs bloqueo YouTube (descartar despues de probar)

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar Cloudflare WARP (repo oficial apt, soporta Ubuntu 24.04)
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq
          sudo apt-get install -y cloudflare-warp
          sudo systemctl enable --now warp-svc
          sleep 3
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000
          warp-cli --accept-tos connect
          sleep 5
          warp-cli --accept-tos status
          echo "--- trace (deberia decir warp=on) ---"
          curl -s https://www.cloudflare.com/cdn-cgi/trace/ | grep warp || true

      - name: Probar yt-dlp SIN proxy (control - debe fallar con bot-check)
        run: |
          python3 -m pip install -q -U yt-dlp
          echo "--- SIN proxy ---"
          python3 -m yt_dlp --skip-download -q --print "%(title)s" "https://www.youtube.com/watch?v=EM7fr1Txae4" 2>&1 || true

      - name: Probar yt-dlp CON proxy WARP (test real)
        run: |
          echo "--- CON proxy WARP socks5://127.0.0.1:40000 ---"
          python3 -m yt_dlp --proxy "socks5://127.0.0.1:40000" --skip-download -q --print "%(title)s" "https://www.youtube.com/watch?v=EM7fr1Txae4" 2>&1 || true
