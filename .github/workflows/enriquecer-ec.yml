name: Enriquecer documentos Ecuador (Playwright)

on:
  schedule:
    # 03:00 UTC = 10 PM Lima/Quito (todos los dias). Procesa hasta 100 PLs
    # sin docs. Tras ~6-7 noches, los 622 PLs quedan enriquecidos. Despues
    # solo trabaja sobre PLs nuevos que aparezcan.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximo de proyectos a procesar (default 100)'
        required: false
        default: '100'
      force:
        description: 'Re-procesar PLs que ya tienen docs (true/false)'
        required: false
        default: 'false'
      estado:
        description: 'Filtrar por estado (opcional)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: enriquecer-ec-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests pycryptodome openpyxl pandas playwright

      - name: Instalar Chromium para Playwright
        run: |
          python -m playwright install chromium --with-deps

      - name: Bootstrap DB Ecuador desde snapshot gz
        run: |
          if [ -f data/proyectos_ec.db.gz ]; then
            echo "[bootstrap] decomprimiendo data/proyectos_ec.db.gz"
            gunzip -kc data/proyectos_ec.db.gz > proyectos_ec.db
            ls -lh proyectos_ec.db
          else
            echo "[bootstrap] no hay snapshot, importando CSV..."
            python -m scraper_ec.cli init
            python -m scraper_ec.cli importar-csv data/ppless_listado_2025-2029_snapshot.csv
          fi

      - name: Stats inicial
        run: |
          python -c "
          import sqlite3
          c = sqlite3.connect('proyectos_ec.db')
          total = c.execute('SELECT COUNT(*) FROM proyectos').fetchone()[0]
          con_docs = c.execute('SELECT COUNT(DISTINCT n_tramite) FROM documentos').fetchone()[0]
          docs_total = c.execute('SELECT COUNT(*) FROM documentos').fetchone()[0]
          print(f'[stats] proyectos={total} con_docs={con_docs} docs_total={docs_total} restantes={total-con_docs}')
          "

      - name: Determinar parametros
        id: params
        run: |
          LIMIT="${{ inputs.limit || '100' }}"
          FORCE="${{ inputs.force || 'false' }}"
          ESTADO="${{ inputs.estado || '' }}"
          ARGS="--limit $LIMIT"
          if [ "$FORCE" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ -n "$ESTADO" ]; then
            ARGS="$ARGS --estado "$ESTADO""
          fi
          echo "args=$ARGS" >> $GITHUB_OUTPUT

      - name: Enriquecer documentos
        run: |
          python -X utf8 -m scraper_ec.cli enriquecer-documentos ${{ steps.params.outputs.args }} || echo "[warn] enriquecer termino con errores, sigue al snapshot"

      - name: Stats final
        run: |
          python -c "
          import sqlite3
          c = sqlite3.connect('proyectos_ec.db')
          total = c.execute('SELECT COUNT(*) FROM proyectos').fetchone()[0]
          con_docs = c.execute('SELECT COUNT(DISTINCT n_tramite) FROM documentos').fetchone()[0]
          docs_total = c.execute('SELECT COUNT(*) FROM documentos').fetchone()[0]
          print(f'[stats] proyectos={total} con_docs={con_docs} docs_total={docs_total} restantes={total-con_docs}')
          "

      - name: Generar snapshot gz
        run: |
          python -m scraper_ec.cli --db proyectos_ec.db snapshot

      - name: Auto-commit snapshot si cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/proyectos_ec.db.gz
          if git diff --staged --quiet; then
            echo "Sin cambios en el snapshot."
          else
            git commit -m "EC: auto-refresh documentos $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi
