name: Actualizar Ecuador (CSV + documentos)

on:
  schedule:
    # 03:00 UTC = 10 PM Lima/Quito — corrida principal nocturna (full enrich).
    - cron: '0 3 * * *'
    # 13:00 UTC = 8 AM Lima/Quito (despues que la Asamblea abre).
    # Mantiene la lista de PLs sincronizada durante el dia + enriquece nuevos.
    - cron: '0 13 * * *'
    # 17:00 UTC = 12 PM Lima/Quito.
    - cron: '0 17 * * *'
    # 21:00 UTC = 4 PM Lima/Quito (cierre del horario habil).
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximo de proyectos a procesar (default 100)'
        required: false
        default: '100'
      force:
        description: 'Re-procesar PLs que ya tienen docs (true/false)'
        required: false
        default: 'false'
      solo_sin_fase:
        description: 'Solo re-procesa PLs cuyos docs tienen fase nula (true/false)'
        required: false
        default: 'false'
      estado:
        description: 'Filtrar por estado (opcional)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: enriquecer-ec-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests pycryptodome openpyxl pandas playwright

      - name: Instalar Chromium para Playwright
        run: |
          python -m playwright install chromium --with-deps

      - name: Bootstrap DB Ecuador desde snapshot gz
        run: |
          if [ -f data/proyectos_ec.db.gz ]; then
            echo "[bootstrap] decomprimiendo data/proyectos_ec.db.gz"
            gunzip -kc data/proyectos_ec.db.gz > proyectos_ec.db
            ls -lh proyectos_ec.db
          else
            echo "[bootstrap] no hay snapshot, importando CSV..."
            python -m scraper_ec.cli init
            python -m scraper_ec.cli importar-csv data/ppless_listado_2025-2029_snapshot.csv
          fi

      - name: Stats inicial
        run: |
          python -c "
          import sqlite3
          c = sqlite3.connect('proyectos_ec.db')
          total = c.execute('SELECT COUNT(*) FROM proyectos').fetchone()[0]
          con_docs = c.execute('SELECT COUNT(DISTINCT n_tramite) FROM documentos').fetchone()[0]
          docs_total = c.execute('SELECT COUNT(*) FROM documentos').fetchone()[0]
          print(f'[stats inicial] proyectos={total} con_docs={con_docs} docs_total={docs_total} restantes={total-con_docs}')
          "

      - name: Actualizar lista de proyectos (CSV download via Playwright)
        run: |
          # Descarga el CSV fresco del portal Ppless v2 + re-importa.
          # Captura proyectos nuevos y cambios de estado en los existentes.
          python -X utf8 -m scraper_ec.cli actualizar-csv || echo "[warn] actualizar-csv fallo, sigue con DB actual"

      - name: Stats post-actualizar-csv
        run: |
          python -c "
          import sqlite3
          c = sqlite3.connect('proyectos_ec.db')
          total = c.execute('SELECT COUNT(*) FROM proyectos').fetchone()[0]
          con_docs = c.execute('SELECT COUNT(DISTINCT n_tramite) FROM documentos').fetchone()[0]
          print(f'[stats post-csv] proyectos={total} con_docs={con_docs} restantes={total-con_docs}')
          "

      - name: Determinar parametros
        id: params
        run: |
          LIMIT="${{ inputs.limit || '100' }}"
          FORCE="${{ inputs.force || 'false' }}"
          SOLO_SIN_FASE="${{ inputs.solo_sin_fase || 'false' }}"
          ESTADO="${{ inputs.estado || '' }}"
          ARGS="--limit $LIMIT"
          if [ "$FORCE" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ "$SOLO_SIN_FASE" = "true" ]; then
            ARGS="$ARGS --solo-sin-fase"
          fi
          if [ -n "$ESTADO" ]; then
            ARGS="$ARGS --estado "$ESTADO""
          fi
          echo "args=$ARGS" >> $GITHUB_OUTPUT

      - name: Enriquecer documentos
        run: |
          python -X utf8 -m scraper_ec.cli enriquecer-documentos ${{ steps.params.outputs.args }} || echo "[warn] enriquecer termino con errores, sigue al snapshot"

      - name: Stats final
        run: |
          python -c "
          import sqlite3
          c = sqlite3.connect('proyectos_ec.db')
          total = c.execute('SELECT COUNT(*) FROM proyectos').fetchone()[0]
          con_docs = c.execute('SELECT COUNT(DISTINCT n_tramite) FROM documentos').fetchone()[0]
          docs_total = c.execute('SELECT COUNT(*) FROM documentos').fetchone()[0]
          print(f'[stats] proyectos={total} con_docs={con_docs} docs_total={docs_total} restantes={total-con_docs}')
          "

      - name: Generar snapshot gz
        run: |
          python -m scraper_ec.cli --db proyectos_ec.db snapshot

      - name: Auto-commit snapshot si cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/proyectos_ec.db.gz
          if git diff --staged --quiet; then
            echo "Sin cambios en el snapshot."
            exit 0
          fi
          git commit -m "EC: auto-refresh documentos $(date -u +%Y-%m-%d) [skip ci]"
          # Retry-on-conflict loop: si otro commit llego al remote entremedio,
          # rebaseamos y reintentamos. Hasta 3 intentos.
          for i in 1 2 3; do
            if git push; then
              echo "Push OK (intento $i)"
              exit 0
            fi
            echo "Push fallo (intento $i), rebaseando con origin/main..."
            git fetch origin main
            # rebase con "their" preferido por si hay conflicto en el snapshot
            git rebase -X theirs origin/main || {
              echo "Rebase fallo, abortando intento $i"
              git rebase --abort
              sleep 5
            }
          done
          echo "Push fallo despues de 3 intentos."
          exit 1
