name: Vigilar Congreso en vivo (Fase 0)

# Detecta cuando el Pleno o una comision ordinaria entra EN VIVO en YouTube,
# avisa por WhatsApp, Y transcribe el audio real en vivo (yt-dlp +
# faster-whisper) acumulando en sesiones_transcripciones. Repo publico =>
# minutos de Actions gratis.
# NOTA: el cron de GitHub se atrasa 0-15 min en horas pico; como las sesiones
# duran horas, igual se capturan. Para pruebas usar "Run workflow" (dispatch).
#
# YouTube bloquea las IPs de datacenter de GitHub Actions ("Sign in to
# confirm you're not a bot") - verificado que NI el cliente android
# (--extractor-args) ni PO tokens lo esquivan, el bloqueo es por
# reputacion de IP. Lo que SI funciona: tunelizar yt-dlp por Cloudflare
# WARP (VPN gratis de Cloudflare) - verificado en vivo 2026-09-15
# (_test_warp.yml: mismo request, sin proxy = bot-check, con proxy WARP =
# titulo real, sin login ni cuenta). Por eso instalamos WARP en modo
# proxy antes de tocar YouTube.

on:
  schedule:
    # Cada 10 min en horario de actividad parlamentaria (Lima = UTC-5).
    # 13:00-03:00 UTC = 8 AM - 10 PM Lima.
    - cron: '*/10 13-23 * * 1-5'
    - cron: '*/10 0-3 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vigilar-congreso
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache pip + modelo Whisper (persiste entre runs)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: vigilar-congreso-deps-${{ hashFiles('.github/workflows/vigilar-congreso.yml') }}

      - name: Instalar deps
        run: |
          pip install -q yt-dlp requests faster-whisper imageio-ffmpeg
          # El binario portable de imageio-ffmpeg crasheaba con SIGSEGV en
          # este runner incluso para una conversion LOCAL sin red de por
          # medio (bug real encontrado en vivo 2026-09-15, corrida #795) -
          # el de apt, compilado y probado para este mismo Ubuntu, no.
          sudo apt-get install -y -qq ffmpeg

      - name: Instalar Cloudflare WARP en modo proxy (SOCKS5 :40000)
        run: |
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloudflare-warp
          sudo systemctl enable --now warp-svc
          sleep 3
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000
          warp-cli --accept-tos connect
          sleep 5
          warp-cli --accept-tos status

      - name: Puente SOCKS5->HTTP para ffmpeg (privoxy :8118)
        run: |
          # Causa raiz real encontrada en vivo 2026-09-15 (corrida #788,
          # con el stderr de yt-dlp ya visible): "ffmpeg does not support
          # SOCKS proxies. Downloading is likely to fail" + "ffmpeg
          # exited with code -11" (segfault) - para un stream EN VIVO,
          # yt-dlp SIEMPRE delega la descarga a ffmpeg (--hls-prefer-native
          # no lo evita), y ffmpeg no entiende socks5://. privoxy hace de
          # puente: recibe HTTP en :8118 y lo reenvia por el SOCKS5 de
          # WARP - eso SI lo puede usar ffmpeg via las variables de
          # entorno http_proxy/https_proxy estandar.
          sudo apt-get install -y -qq privoxy
          echo "forward-socks5 / 127.0.0.1:40000 ." | sudo tee -a /etc/privoxy/config
          sudo systemctl restart privoxy
          sleep 2
          curl -s -x http://127.0.0.1:8118 -o /dev/null -w "privoxy->WARP HTTP %{http_code}\n" https://www.youtube.com/

      - name: Bootstrap DB Peru desde la rama datos
        run: bash scripts/bajar_db.sh proyectos.db.gz proyectos.db || true

      - name: Detectar y notificar
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          PYTHONIOENCODING: utf-8
          YT_DLP_PROXY: socks5://127.0.0.1:40000
        run: |
          # El bootstrap de arriba (antes iba despues de este paso) tiene
          # que ir primero para que el aviso pueda buscar los puntos de
          # agenda de HOY en proyectos.db (ver congreso_live/agenda_preview.py)
          # - es best-effort: si la DB no esta, el aviso sale igual, solo
          # sin el bloque de agenda.
          python -X utf8 -u -m congreso_live.cli check || echo "[warn] check fallo, sigo"

      - name: Transcribir sesiones en vivo (continuo, hasta 170 min, con commits periodicos)
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          PYTHONIOENCODING: utf-8
          YT_DLP_PROXY: socks5://127.0.0.1:40000
          FFMPEG_HTTP_PROXY: http://127.0.0.1:8118
          FFMPEG_BIN: /usr/bin/ffmpeg
        run: |
          # live-watch (no live-watch-once): queda transcribiendo SIN
          # cortar mientras la sesion siga en vivo, en vez de un tick de
          # pocos minutos cada 10 min. El disparador externo (cron-job.org,
          # cada 10 min) llama de nuevo mientras este job sigue corriendo,
          # pero concurrency (cancel-in-progress: false, abajo) hace que
          # esos llamados se encolen en vez de duplicar o cortar el job -
          # el siguiente arranca apenas este termine, asi que la cobertura
          # es practicamente continua (~1 min de hueco entre relevos de
          # hasta 170 min - cubre casi cualquier sesion de comision en un
          # solo tramo, sin cortes en el medio). 170 min dentro del job de
          # 180 deja margen para el setup inicial y el commit del final.
          #
          # --idle-exit-minutos 8: si NO hay nada en vivo, sale a los 8
          # min en vez de quedarse ocupando el job (y bloqueando la cola
          # de concurrency) hasta 170 min sin hacer nada - bug real
          # encontrado en vivo 2026-09-15, la corrida #696 se quedo
          # colgada ~170 min sin nada que transcribir.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          timeout 10500 python -X utf8 -u -m congreso_live.cli live-watch \
              --max-total-minutos 170 --idle-exit-minutos 8 &
          watch_pid=$!

          # Commitea el snapshot de la DB cada 5 min MIENTRAS live-watch sigue
          # vivo, en vez de solo al final del tramo (hasta 170 min despues) -
          # sin esto Streamlit (que lee del snapshot commiteado) queda ciego
          # toda la sesion. sqlite hace commit por chunk (~40s) con journal
          # por defecto, asi que el archivo en disco esta consistente fuera
          # de una transaccion - agarrarlo aca cada 5 min es seguro.
          # set +e alrededor del cuerpo del loop: bug real encontrado en vivo
          # 2026-09-15 (corrida #798) - con -e heredado del shell de Actions,
          # CUALQUIER comando del cuerpo que devolviera !=0 (gzip, mv, git
          # add) mataba este script entero en silencio, SIN imprimir nada
          # (el "&&"/"||" de las lineas de push si estan exceptuados de -e,
          # pero el resto del cuerpo no) - el proceso de python en segundo
          # plano seguia mandando output al mismo log, por eso parecia que
          # "todo seguia corriendo" mientras el commit periodico nunca se
          # disparaba ni una sola vez en 3+ ventanas de 5 min, con transcripcion
          # real acumulando (verificado: 11214+ caracteres de una sesion,
          # 8700+ de otra) que se hubiera perdido si el job se cortaba antes
          # del commit final. Con set +e + echo de cada paso, un fallo real
          # queda visible en vez de abortar mudo.
          # data/congreso_live_state.json SI esta trackeado por git y
          # live-watch lo reescribe todo el tiempo (dedupe + log de
          # sesiones) - agregarlo tambien al commit (bug real 2026-09-15,
          # corrida #798: antes solo se agregaba proyectos.db.gz, dejando
          # ese otro archivo modificado y sin stagear, lo que rompia
          # cualquier "git rebase" posterior).
          set +e
          tick=0
          while kill -0 "$watch_pid" 2>/dev/null; do
            sleep 300
            tick=$((tick + 1))
            echo "[commit-loop] tick $tick: watch_pid=$watch_pid vivo, chequeando proyectos.db"
            if [ -f proyectos.db ]; then
              # La base va a la rama `datos` (un solo commit sin historial, ver
              # scripts/publicar_db.sh): base_remota = lo publicado es la base y
              # se le suman las transcripciones de este job, con reintento si
              # otro workflow publico en el medio (mismo merge por filas que
              # evito la perdida de transcripciones del 2026-09-15/16).
              bash scripts/publicar_db.sh base_remota proyectos.db                 || echo "[commit-loop] tick $tick: [warn] no se pudo publicar la base, sigo"
              # congreso_live_state.json (dedupe de avisos) sigue en main.
              git add data/congreso_live_state.json
              if git diff --staged --quiet; then
                echo "[commit-loop] tick $tick: estado sin cambios"
              else
                git commit -m "Congreso live: estado $(date -u +%Y-%m-%d-%H%M) [skip ci]"
                if ! git push; then
                  # --hard, no --soft: bug real 2026-09-16 (un --soft revirtio
                  # otros archivos que habian cambiado en origin).
                  git fetch origin main
                  cp data/congreso_live_state.json /tmp/merged_state.json
                  git reset --hard origin/main
                  mv -f /tmp/merged_state.json data/congreso_live_state.json
                  git add data/congreso_live_state.json
                  git diff --staged --quiet || git commit -m "Congreso live: estado $(date -u +%Y-%m-%d-%H%M) [skip ci]"
                  git push || echo "[commit-loop] tick $tick: [warn] estado no se pudo pushear, sigo"
                fi
              fi
            else
              echo "[commit-loop] tick $tick: [warn] proyectos.db no existe todavia"
            fi
          done
          echo "[commit-loop] watch_pid=$watch_pid termino, salgo del loop de commits ($tick ticks)"
          wait "$watch_pid" || echo "[warn] live-watch fallo, sigo"
          set -e

      - name: Publicar base en la rama datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Publicacion final del tramo (el loop de arriba publica cada 5 min).
          if [ -f proyectos.db ]; then
            bash scripts/publicar_db.sh base_remota proyectos.db
          fi

      - name: Commitear estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/congreso_live_state.json
          if git diff --staged --quiet; then
            echo "sin cambios"
            exit 0
          fi
          git commit -m "Congreso live: estado $(date -u +%Y-%m-%d-%H%M) [skip ci]"
          for i in 1 2 3; do
            if git push; then
              echo "Push OK (intento $i)"
              exit 0
            fi
            echo "Push fallo (intento $i), reintentando sobre origin/main..."
            git fetch origin main
            cp data/congreso_live_state.json /tmp/merged_state.json
            # --hard, no --soft: bug real 2026-09-16 (backfill-vod.yml #7).
            git reset --hard origin/main
            mv -f /tmp/merged_state.json data/congreso_live_state.json
            git add data/congreso_live_state.json
            if git diff --staged --quiet; then
              echo "Ya esta en origin/main, nada que commitear."
              exit 0
            fi
            git commit -m "Congreso live: estado $(date -u +%Y-%m-%d-%H%M) [skip ci]"
            sleep 5
          done
          echo "Push fallo despues de 3 intentos."
          exit 1
