name: Posturas de congresistas (Gemma)

# Lee con Gemma las sesiones transcritas que aun no tienen posturas (consultas/posturas.py).
# Gemma es gratis y tiene su propio cupo, asi no gasta el de flash-lite que usan la app y
# las alertas. Va a una llamada por minuto: cada corrida avanza lo que puede en ~100 min y
# la siguiente sigue donde quedo (guarda de a 3 sesiones con commit en main).

on:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: posturas
  cancel-in-progress: false

jobs:
  leer:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - run: pip install -c constraints.txt -q requests "google-genai==2.31.0" streamlit

      - name: Bajar la base (transcripciones)
        run: bash scripts/bajar_db.sh proyectos.db.gz proyectos.db

      - name: Resumir sesiones nuevas (antes la rutina de Claude, apagada desde el 12/11)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: timeout 25m python -X utf8 -u -m congreso_live.resumir correr 22 || echo "[warn] resumir corto; la proxima corrida sigue"

      - name: Guardar resumenes (el JSON pasa 1 MB, va por git y no por la API)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/transcripciones_resumenes.json
          git diff --cached --quiet && exit 0
          git commit -q -m "transcripciones: resumenes con Gemma"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1

      - name: Leer sesiones nuevas
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PYTHONIOENCODING: utf-8
        run: timeout 30m python -X utf8 -u -m consultas.posturas precalcular || echo "[warn] corte por tiempo o error; la proxima corrida sigue"
