name: Alertas diarias Radar Legislativo

on:
  schedule:
    # GH Actions cron tiene atraso 0-3h. Disparamos temprano para que con
    # atraso llegue cerca de 9 AM Lima.
    #   11 UTC (6 AM Lima) + ~2-3h atraso = 8-9 AM Lima
    # already_sent_today previene duplicados. Si este workflow falla,
    # refrescar-pe.yml envia la alerta como backup en su corrida de
    # 13 UTC (que tambien llega cerca de 8-9 AM Lima con atraso).
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Slot (09, 10, manual)'
        required: false
        default: 'manual'
      force:
        description: 'Forzar envio (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write   # para commitear alert_sent_log.json + actualizar proyectos.db.gz

concurrency:
  group: alerts-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  send-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          # Necesario para que el push funcione con el token default
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Cache de DBs (persiste entre runs)
        id: cache-dbs
        uses: actions/cache@v5
        with:
          path: |
            proyectos.db
            proyectos_ec.db
          # key incluye run_id → siempre crea nueva entry
          # restore-keys → busca la mas reciente que empiece con 'dbs-'
          key: dbs-${{ github.run_id }}
          restore-keys: |
            dbs-

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          # Solo lo necesario; playwright se omite porque enriquecer-documentos
          # corre localmente, no en CI.
          pip install requests pycryptodome openpyxl pandas

      - name: Bootstrap DB Peru desde snapshot gzipped (solo si no hay cache)
        if: hashFiles('proyectos.db') == ''
        run: |
          if [ -f data/proyectos.db.gz ]; then
            echo "[bootstrap] descomprimiendo data/proyectos.db.gz"
            gunzip -kc data/proyectos.db.gz > proyectos.db
            ls -lh proyectos.db
          else
            echo "[bootstrap] sin snapshot — la DB se construira desde cero (lento, ~40 min)"
          fi

      - name: Bootstrap DB Ecuador desde CSV (solo si no hay cache)
        if: hashFiles('proyectos_ec.db') == ''
        run: |
          if [ -f data/ppless_listado_2025-2029_snapshot.csv ]; then
            echo "[bootstrap] importando CSV inicial de Ecuador"
            python -m scraper_ec.cli init
            python -m scraper_ec.cli importar-csv data/ppless_listado_2025-2029_snapshot.csv
          fi

      - name: Refrescar Peru (sync incremental)
        run: |
          timeout 1500 python -m scraper.cli update || echo "[warn] sync PE timeout — sigo con DB actual"

      - name: Heartbeat START (workflow arranco)
        run: |
          # Registra que el workflow arranco — antes de cualquier step que
          # pueda fallar. Si vemos started pero no ok, sabemos donde se
          # rompio.
          python -X utf8 -m sistema.heartbeat --db proyectos.db --source alertas_diarias --status started
          echo "Schedule trigger: '${{ github.event.schedule }}'"
          echo "Event name: '${{ github.event_name }}'"
          echo "Run number: ${{ github.run_number }}"
          date -u

      - name: Determinar slot horario
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slot=${{ inputs.slot }}" >> $GITHUB_OUTPUT
            if [ "${{ inputs.force }}" = "true" ]; then
              echo "force_flag=--force" >> $GITHUB_OUTPUT
            else
              echo "force_flag=" >> $GITHUB_OUTPUT
            fi
          else
            # Usar el CRON SCHEDULE que dispara este run, NO la hora UTC actual.
            # GitHub Actions atrasa crons 0-3h en horas pico → si calculamos
            # por hora actual, cron de 14:00 que corre a las 16:30 daria
            # HOUR_UTC=16 (ni 14 ni 15) → slot=manual erroneamente.
            # github.event.schedule devuelve la expresion cron exacta que
            # dispara el run.
            # Solo hay 1 cron (0 11 * * *). slot=09 nominal.
            echo "slot=09" >> $GITHUB_OUTPUT
            echo "force_flag=" >> $GITHUB_OUTPUT
            echo "Cron schedule: $SCHEDULE"
          fi

      - name: Construir y enviar alerta
        id: send
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          ALERT_RECIPIENT: ${{ secrets.ALERT_RECIPIENT }}
          PYTHONIOENCODING: utf-8
        run: |
          # Validacion temprana de secrets — si faltan, fail fast con mensaje claro
          # (asi GitHub no deshabilita el cron silenciosamente por fallos opacos).
          missing=""
          [ -z "$RESEND_API_KEY" ] && missing="$missing RESEND_API_KEY"
          [ -z "$RESEND_FROM" ]    && missing="$missing RESEND_FROM"
          [ -z "$ALERT_RECIPIENT" ] && missing="$missing ALERT_RECIPIENT"
          if [ -n "$missing" ]; then
            echo "::error::Faltan secrets en el repo:$missing"
            echo "Ir a Settings > Secrets and variables > Actions y agregarlos"
            exit 1
          fi
          python -X utf8 -m alerts.cli send --slot ${{ steps.slot.outputs.slot }} ${{ steps.slot.outputs.force_flag }}

      - name: Heartbeat OK (envio exitoso)
        if: steps.send.outcome == 'success'
        run: |
          # Step de envio paso OK -> sobrescribimos started con ok.
          python -X utf8 -m sistema.heartbeat --db proyectos.db --source alertas_diarias --status ok

      - name: Heartbeat FAILED (envio fallo)
        if: steps.send.outcome == 'failure'
        run: |
          # Step de envio fallo. Dejamos heartbeat con status=failed para
          # que el dashboard muestre dot rojo y el usuario sepa de inmediato.
          python -X utf8 -m sistema.heartbeat --db proyectos.db --source alertas_diarias --status failed
          echo "::error::Daily alert failed — revisa el log del step 'Construir y enviar alerta'"

      - name: Commit log de alertas (si cambio)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/alert_sent_log.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Sin cambios en alert_sent_log.json"
            exit 0
          fi
          git commit -m "auto: alert_sent_log $(date -u +%Y-%m-%d) [skip ci]"
          # Retry-on-conflict: si otro commit llego al remote entremedio,
          # rebaseamos y reintentamos hasta 3 veces.
          for i in 1 2 3; do
            if git push; then
              echo "Push OK (intento $i)"
              exit 0
            fi
            echo "Push fallo (intento $i), rebaseando..."
            git fetch origin main
            git rebase -X theirs origin/main || {
              echo "Rebase fallo, abortando intento $i"
              git rebase --abort
              sleep 5
            }
          done
          echo "Push fallo despues de 3 intentos."
          exit 1
