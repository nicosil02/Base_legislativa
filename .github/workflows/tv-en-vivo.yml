name: TV en vivo (RPP, America, Willax, Exitosa)

# Escucha el directo de RPP, America Noticias, Willax y Exitosa mientras sale al aire,
# lo transcribe en tramos de 1 min (Whisper) y guarda las menciones de
# autoridades y temas de clientes (noticias/tv_monitor.py, en_vivo).
# Publica la base cada 15 min para que la app las muestre sin esperar.
# Horarios (Lima = UTC-5): 6 a 10 am y 9 a 11 pm, franjas de noticieros.
# ponytail: el schedule de GitHub puede arrancar con 10-30 min de retraso;
# si hace falta puntualidad, dispararlo desde cron-job.org como vigilar-congreso.

on:
  schedule:
    - cron: '0 11 * * *'   # 6:00 Lima, 240 min
    - cron: '0 2 * * *'    # 21:00 Lima, 120 min
  workflow_dispatch:
    inputs:
      minutos:
        description: "Minutos de escucha"
        required: false
        default: "60"
      prueba:
        description: "Solo probar el resumen de avisos con Gemini (no escucha)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: tv-en-vivo
  cancel-in-progress: false

jobs:
  escuchar:
    runs-on: ubuntu-latest
    # Dos maquinas en paralelo, dos canales cada una: con los 4 Whisper en
    # una sola, la transcripcion no alcanzaba el ritmo del directo.
    strategy:
      fail-fast: false
      matrix:
        grupo: [1, 2, 3]  # cada maquina toma un tercio de los directos elegidos (4 Peru + Ecuavisa/Teleamazonas)
    timeout-minutes: 280
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache pip + modelo Whisper (persiste entre runs)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: vigilar-congreso-deps-${{ hashFiles('.github/workflows/vigilar-congreso.yml') }}

      - name: Instalar deps
        run: |
          pip install -q yt-dlp requests faster-whisper imageio-ffmpeg google-genai
          sudo apt-get install -y -qq ffmpeg

      - name: Instalar Cloudflare WARP en modo proxy (SOCKS5 :40000)
        run: |
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloudflare-warp
          sudo systemctl enable --now warp-svc
          sleep 3
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000
          warp-cli --accept-tos connect
          sleep 5
          warp-cli --accept-tos status

      - name: Puente SOCKS5->HTTP para ffmpeg (privoxy :8118)
        run: |
          # Igual que vigilar-congreso.yml: para un directo yt-dlp delega en
          # ffmpeg, que no entiende socks5:// (sin esto cada tramo fallaba al
          # instante, primera prueba 2026-09-28).
          sudo apt-get install -y -qq privoxy
          echo "forward-socks5 / 127.0.0.1:40000 ." | sudo tee -a /etc/privoxy/config
          sudo systemctl restart privoxy
          sleep 2
          curl -s -x http://127.0.0.1:8118 -o /dev/null -w "privoxy->WARP HTTP %{http_code}\n" https://www.youtube.com/

      - name: Bootstrap DB Peru desde la rama datos
        run: bash scripts/bajar_db.sh proyectos.db.gz proyectos.db || true

      - name: Escuchar en vivo
        env:
          PYTHONIOENCODING: utf-8
          YT_DLP_PROXY: socks5://127.0.0.1:40000
          FFMPEG_BIN: /usr/bin/ffmpeg
          FFMPEG_HTTP_PROXY: http://127.0.0.1:8118
          TV_PUBLICAR: "1"
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "${{ github.event.inputs.prueba }}" = "true" ]; then
            [ "${{ matrix.grupo }}" = "1" ] && python -X utf8 -m noticias.tv_monitor probar-aviso
            exit 0
          fi
          MIN="${{ github.event.inputs.minutos }}"
          if [ -z "$MIN" ]; then
            # Sin minutos explicitos (schedule o disparo desde tv-monitor.yml):
            # escuchar hasta el fin de la franja, 10:00 o 23:00 Lima. Fuera de
            # franja (ej. una corrida duplicada que quedo en cola) no escucha.
            ahora=$(( 10#$(TZ=America/Lima date +%H) * 60 + 10#$(TZ=America/Lima date +%M) ))
            if [ "$ahora" -ge 360 ] && [ "$ahora" -lt 600 ]; then MIN=$(( 600 - ahora ));
            elif [ "$ahora" -ge 1260 ] && [ "$ahora" -lt 1380 ]; then MIN=$(( 1380 - ahora ));
            else MIN=0; fi
          fi
          if [ "$MIN" -lt 5 ]; then echo "fuera de franja, no escucho"; exit 0; fi
          python -X utf8 -u -m noticias.tv_monitor en-vivo proyectos.db "$MIN" "${{ matrix.grupo }}" \
              || echo "[warn] en-vivo termino con error, publico lo que haya"

      - name: Publicar base en la rama datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash scripts/publicar_db.sh base_remota proyectos.db
