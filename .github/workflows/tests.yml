name: Tests

on:
  push:
    branches: [main]
    paths: ['**.py', 'pytest.ini', 'requirements.txt', '.github/workflows/tests.yml']
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt pytest faster-whisper

      - name: pytest
        run: python -m pytest
