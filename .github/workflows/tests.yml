name: Tests

on:
  push:
    branches: [main]
    paths: ['**.py', 'pytest.ini', 'requirements.txt', '.github/workflows/tests.yml']
  workflow_dispatch:


env:
  # Abre los datos cifrados de clientes (clientes/privado.py). Otro nombre que
  # GEMINI_API_KEY para no prender Gemini en pasos que no lo usan.
  CLIENTES_CLAVE: ${{ secrets.GEMINI_API_KEY }}

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt pytest pyyaml faster-whisper

      - name: pytest
        run: python -m pytest
