name: Tests

on:
  push:
    branches: [main]
    paths: ['**.py', 'pytest.ini', 'requirements.txt', 'constraints.txt', '.github/workflows/tests.yml']
  pull_request:
    paths: ['**.py', 'pytest.ini', 'requirements.txt', 'constraints.txt', '.github/workflows/tests.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  # Abre los datos cifrados de clientes (clientes/privado.py). Secreto propio
  # (no es la clave de Gemini).
  CLIENTES_CLAVE: ${{ secrets.CLIENTES_CLAVE }}

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Instalar dependencias
        run: pip install -c constraints.txt -r requirements.txt pytest pyyaml faster-whisper

      - name: pytest
        run: python -m pytest
