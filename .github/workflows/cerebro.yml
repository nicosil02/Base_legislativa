name: Cerebro (embeddings del corpus)

# Mantiene data/cerebro.db (vectores de PLs, noticias y sesiones - ver
# cerebro/embeddings.py) al dia: corre despues de cada workflow que trae
# datos nuevos y embebe SOLO lo nuevo o cambiado.
#
# cerebro.db no va a git (vectores, casi no comprimen): se publica como
# adjunto del release "cerebro" (--clobber, sin historial) y la app lo baja
# de ahi (cerebro.embeddings.descargar_si_falta).
#
# Disparo por workflow_run (no por schedule: el cron nativo de GitHub no es
# confiable en este repo, ver backfill-auto.yml).

on:
  workflow_run:
    workflows:
      - "Actualizar Peru (PLs + snapshot)"
      - "Actualizar Ecuador (CSV + documentos)"
      - "Backfill automatico (sesiones perdidas)"
    types: [completed]
  workflow_dispatch:
    inputs:
      resumen:
        description: "Resumen ¿qué pasó hoy?: normal (desde las 18:00 Lima, una vez), probar (escribe sin enviar) o enviar (ya)"
        default: normal
        type: choice
        options: [normal, probar, enviar]
      rejuzgar:
        description: "Volver a juzgar la relevancia de las ultimas 48 h (tras cambiar el criterio)"
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: cerebro
  cancel-in-progress: false

jobs:
  embeber:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # workflow_run arranca en el commit del disparo; queremos los datos mas nuevos

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: pip install -q google-genai sqlite-vec lightrag-hku fastembed openpyxl  # openpyxl: matrices de PLs en el perfil del cliente

      - name: Bajar DBs y el cerebro publicado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/bajar_db.sh proyectos.db.gz proyectos.db
          bash scripts/bajar_db.sh proyectos_ec.db.gz proyectos_ec.db
          # Primera vez el release no existe: se crea vacio y se embebe todo.
          gh release view cerebro > /dev/null 2>&1 || \
            gh release create cerebro --title "Cerebro (embeddings)" \
              --notes "data/cerebro.db generado por .github/workflows/cerebro.yml - no editar a mano." --latest=false
          gh release download cerebro -p cerebro.db -D data --clobber || echo "sin cerebro.db previo, se arma de cero"
          gh release download cerebro -p grafo.tar.gz -D data --clobber             && tar -xzf data/grafo.tar.gz -C data || echo "sin grafo previo, se arma de cero"

      - name: Embeber lo nuevo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python -X utf8 -u -m cerebro.embeddings sincronizar

      - name: ¿Le interesa a cada cliente? (Gemini flash-lite)
        # Antes del grafo: los dos usan el cupo de flash-lite.
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: timeout 600 python -X utf8 -u -m alerts.filtro run ${{ inputs.rejuzgar && '--rejuzgar' || '' }}

      - name: ¿Mismo hecho? (pares de noticias de portales distintos)
        # Con el modelo afinado (entrenar-mismo-hecho.yml) si existe; si no,
        # Gemini flash-lite con tope de pares. Antes del grafo (mismo cupo).
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          if gh release download cerebro -p mismo_hecho_modelo.tar.gz -D data --clobber; then
            tar -xzf data/mismo_hecho_modelo.tar.gz -C data
            pip install -q torch --index-url https://download.pytorch.org/whl/cpu
            pip install -q transformers
          fi
          timeout 900 python -X utf8 -u -m noticias.mismo_hecho run

      - name: ¿Qué pasó hoy? (resumen del dia por Telegram)
        # Una vez por dia desde las 18:00 Lima (alerts/que_paso_hoy.py).
        # Antes del grafo: usa 1 pedido de flash (o lite si no hay cupo).
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: |
          case "${{ inputs.resumen || 'normal' }}" in
            probar) FLAGS="--forzar --no-enviar" ;;
            enviar) FLAGS="--forzar" ;;
            *) FLAGS="" ;;
          esac
          timeout 300 python -X utf8 -u -m alerts.que_paso_hoy run $FLAGS

      - name: Agendas con temas de clientes (Telegram)
        # Cada agenda (comisiones y Plenos PE, Asamblea EC) se juzga una vez
        # por version; solo se avisa lo que le toca a un cliente, y si la
        # agenda cambia, solo lo nuevo (alerts/agenda_interes.py).
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: timeout 300 python -X utf8 -u -m alerts.agenda_interes run

      - name: Grafo de conocimiento (LightRAG) - agregar lo nuevo
        # gemini-3.5-flash-lite / gemma (cupos propios), nunca 3.6-flash: ese
        # tiene 20 pedidos/dia compartidos con el chat de alertas.
        # continue-on-error: si se corta por cupo, la proxima corrida sigue.
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: timeout 2400 python -X utf8 -u -m cerebro.grafo construir 40

      - name: Publicar
        # always(): lo ya embebido se guarda por tandas y se publica aunque
        # el paso anterior se corte por cupo.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f data/cerebro.db ]; then gh release upload cerebro data/cerebro.db --clobber; fi
          if [ -d data/grafo ]; then
            python -X utf8 -m cerebro.grafo empaquetar
            gh release upload cerebro data/grafo.tar.gz --clobber
          fi
