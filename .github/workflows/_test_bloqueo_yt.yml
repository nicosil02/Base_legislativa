name: _TEST bloqueo YouTube (temporal, borrar)

on:
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q yt-dlp
      - name: WARP
        run: |
          curl -fsSL --retry 3 https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp
          sudo systemctl enable --now warp-svc; sleep 3
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000
          warp-cli --accept-tos connect; sleep 5; warp-cli --accept-tos status
      - name: Script de prueba
        run: |
          cat > p.py <<'EOF'
          import sys, yt_dlp
          label, proxy = sys.argv[1], (sys.argv[2] if len(sys.argv) > 2 else None)
          for vid in ["ZEUaL91M6D4", "NhVLhbKCQ_Q"]:
              o = {"quiet": True, "no_warnings": True, "skip_download": True}
              if proxy: o["proxy"] = proxy
              try:
                  with yt_dlp.YoutubeDL(o) as y:
                      i = y.extract_info("https://www.youtube.com/watch?v=" + vid, download=False)
                  print(f"RESULT {label} {vid}: OK captions_es={'es' in (i.get('automatic_captions') or {})} formats={len(i.get('formats') or [])}")
              except Exception as e:
                  print(f"RESULT {label} {vid}: FAIL {str(e)[:90]}")
          EOF
      - name: A - WARP tal cual (sin deno)
        run: python p.py A_warp socks5://127.0.0.1:40000 || true
      - name: B - sin proxy (IP de GitHub)
        run: python p.py B_directo || true
      - name: Instalar deno
        run: curl -fsSL https://deno.land/install.sh | sh -s -- -y && echo "$HOME/.deno/bin" >> $GITHUB_PATH
      - name: C - WARP + deno
        run: deno --version && python p.py C_warp_deno socks5://127.0.0.1:40000 || true
      - name: D - WARP IP nueva + deno
        run: |
          warp-cli --accept-tos disconnect; warp-cli --accept-tos registration delete
          warp-cli --accept-tos registration new; warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000; warp-cli --accept-tos connect; sleep 5
          python p.py D_warp_nueva_deno socks5://127.0.0.1:40000 || true
      - name: E - sin proxy + deno
        run: python p.py E_directo_deno || true
