name: _TEST modelos gratis para el grafo (temporal, borrar)

on:
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q google-genai
      - name: Probar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat > p.py <<'EOF'
          import os, time
          from google import genai
          c = genai.Client(api_key=os.environ["GEMINI_API_KEY"])
          ms = [m.name for m in c.models.list() if "generateContent" in (m.supported_actions or [])]
          print("RESULT modelos:", [m for m in ms if any(x in m for x in ("gemma", "lite", "flash"))])
          texto = ("SENASA suspendio la venta de clorpirifos, metomil y glifosato tras la orden del "
                   "Tribunal Constitucional. El congresista Juan Perez (Fuerza Popular) presento el PL "
                   "00438-2026-2031-CD para modificar la Ley de Sanidad Agraria.")
          prompt = ("Extrae las entidades (nombre|tipo) y relaciones (origen|relacion|destino) del texto. "
                    "Tipos: norma, proyecto_de_ley, legislador, entidad_publica, producto, partido.\n\n" + texto)
          for m in [x for x in ms if "gemma" in x][-3:] + [x for x in ms if "lite" in x][-2:]:
              t = time.time()
              try:
                  r = c.models.generate_content(model=m, contents=prompt)
                  print(f"RESULT {m} OK {time.time()-t:.1f}s -> {(r.text or '')[:400]!r}")
              except Exception as e:
                  print(f"RESULT {m} FAIL {str(e)[:200]}")
          EOF
          python p.py
