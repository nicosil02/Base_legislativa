name: Backfill transcripcion (VOD ya terminado)

# Recupera una sesion del Congreso que YA TERMINO y que la captura en
# vivo se perdio (bug de deteccion, corte de luz, lo que sea) - baja el
# audio COMPLETO del video ya grabado y lo transcribe con Whisper, sin
# esperar los captions automaticos de YouTube (tardan de horas a dias,
# ver transcripciones.py). Se dispara a mano, con el video_id/tipo/titulo
# de la sesion perdida.
#
# Mismo esquema WARP que vigilar-congreso.yml (YouTube bloquea IPs de
# datacenter, WARP lo esquiva) - grupo de concurrency propio para no
# esperar en la cola del monitoreo continuo, que puede tardar horas.

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "ID del video de YouTube (ej. uawItrs3E9U)"
        required: true
      tipo:
        description: "ej. 'Comision: Salud' o 'Pleno: Diputados'"
        required: true
      titulo:
        description: "Titulo tal cual aparecio en YouTube"
        required: true

permissions:
  contents: write

# Grupo propio (ya NO el de vigilar-congreso.yml). Antes compartia ese
# grupo porque un push concurrente a data/proyectos.db.gz hacia que
# "git rebase -X theirs" descartara el commit ENTERO de un lado (bug
# real 2026-09-15, la transcripcion de Salud se perdio asi la primera
# vez) - pero eso ya esta arreglado de raiz (congreso_live/merge_db.py
# mergea sesiones_transcripciones por fila antes de recommitear, ver
# vigilar-congreso.yml), asi que ya no hace falta serializar. Compartir
# el grupo con vigilar-congreso tenia un costo real: el cron de ese
# workflow dispara cada 10 min y le ganaba la cola a cualquier dispatch
# manual de este (verificado en vivo 2026-09-15: 2 intentos de backfill
# de Salud cancelados antes de arrancar, nunca llegaron a correr).
concurrency:
  group: backfill-vod
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache pip + modelo Whisper (persiste entre runs)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: vigilar-congreso-deps-${{ hashFiles('.github/workflows/vigilar-congreso.yml') }}

      - name: Instalar deps
        run: |
          pip install -q yt-dlp requests faster-whisper "av<19" imageio-ffmpeg
          # Ver vigilar-congreso.yml: el binario portable de imageio-ffmpeg
          # crasheaba (SIGSEGV) en runners de GitHub Actions - el de apt
          # (probado para este mismo Ubuntu) no.
          sudo apt-get install -y -qq ffmpeg

      - name: Instalar Cloudflare WARP en modo proxy (SOCKS5 :40000)
        run: |
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloudflare-warp
          sudo systemctl enable --now warp-svc
          sleep 3
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000
          warp-cli --accept-tos connect
          sleep 5
          warp-cli --accept-tos status

      - name: Bootstrap DB Peru desde la rama datos
        run: bash scripts/bajar_db.sh proyectos.db.gz proyectos.db || true

      - name: Bajar y transcribir el VOD completo
        env:
          PYTHONIOENCODING: utf-8
          YT_DLP_PROXY: socks5://127.0.0.1:40000
          FFMPEG_BIN: /usr/bin/ffmpeg
        run: |
          python -X utf8 -u -m congreso_live.cli backfill-vod \
              --video-id "${{ inputs.video_id }}" \
              --tipo "${{ inputs.tipo }}" \
              --titulo "${{ inputs.titulo }}"

      - name: Publicar base en la rama datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # base_remota: se suma la transcripcion de este VOD a la base
          # publicada en `datos` (ver scripts/publicar_db.sh).
          bash scripts/publicar_db.sh base_remota proyectos.db
