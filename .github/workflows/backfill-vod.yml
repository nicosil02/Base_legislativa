name: Backfill transcripcion (VOD ya terminado)

# Recupera a mano (dispatch con video_id/tipo/titulo) una sesion ya terminada
# cuya captura en vivo se perdio: baja el audio completo y lo transcribe con
# Whisper, sin esperar los captions de YouTube. Mismo esquema WARP que
# vigilar-congreso.yml.

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "ID del video de YouTube (ej. uawItrs3E9U)"
        required: true
      tipo:
        description: "ej. 'Comision: Salud' o 'Pleno: Diputados'"
        required: true
      titulo:
        description: "Titulo tal cual aparecio en YouTube"
        required: true

permissions:
  contents: write

# Grupo propio y por video: compartir el de vigilar-congreso hacia que su
# cron le ganara la cola a estos dispatch, y un solo grupo cancela las
# corridas en espera. publicar_db.sh une por fila, asi que videos
# distintos pueden correr a la vez.
concurrency:
  group: backfill-vod-${{ inputs.video_id }}
  cancel-in-progress: false


env:
  # Abre los datos cifrados de clientes (clientes/privado.py). Otro nombre que
  # GEMINI_API_KEY para no prender Gemini en pasos que no lo usan.
  CLIENTES_CLAVE: ${{ secrets.GEMINI_API_KEY }}

jobs:
  backfill:
    runs-on: ubuntu-latest
    # 120: una sesion de 3 h (Justicia 29/09) no entraba en 60 con Whisper en CPU.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache pip + modelo Whisper (persiste entre runs)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: vigilar-congreso-deps-${{ hashFiles('.github/workflows/vigilar-congreso.yml') }}

      - name: Instalar deps
        run: |
          pip install -q yt-dlp requests faster-whisper "av<19" imageio-ffmpeg
          # ffmpeg de apt: el portable de imageio-ffmpeg crasheaba (SIGSEGV).
          sudo apt-get install -y -qq ffmpeg

      - name: Instalar Cloudflare WARP en modo proxy (SOCKS5 :40000)
        run: |
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloudflare-warp
          sudo systemctl enable --now warp-svc
          sleep 3
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000
          warp-cli --accept-tos connect
          sleep 5
          warp-cli --accept-tos status

      - name: Bootstrap DB Peru desde la rama datos
        run: bash scripts/bajar_db.sh proyectos.db.gz proyectos.db || true

      - name: Bajar y transcribir el VOD completo
        env:
          PYTHONIOENCODING: utf-8
          YT_DLP_PROXY: socks5://127.0.0.1:40000
          FFMPEG_BIN: /usr/bin/ffmpeg
        run: |
          python -X utf8 -u -m congreso_live.cli backfill-vod \
              --video-id "${{ inputs.video_id }}" \
              --tipo "${{ inputs.tipo }}" \
              --titulo "${{ inputs.titulo }}"

      - name: Publicar base en la rama datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Solo la parte transcripciones (ver scripts/publicar_db.sh).
          bash scripts/publicar_db.sh proyectos.db transcripciones
