name: _TEST embeddings Gemini + sqlite-vec (temporal, borrar)

on:
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q google-genai sqlite-vec numpy
      - name: Probar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat > p.py <<'EOF'
          import os, sqlite3, time, numpy as np, sqlite_vec
          from google import genai
          from google.genai import types
          c = genai.Client(api_key=os.environ["GEMINI_API_KEY"])
          ms = [m.name for m in c.models.list() if "embed" in m.name]
          print("RESULT modelos:", ms)
          perfil = "Bayer Crop Science: agroquimicos, plaguicidas, semillas, transgenicos, registro de productos fitosanitarios, SENASA, glifosato, biotecnologia agricola"
          textos = [
              "Congreso aprueba moratoria a los cultivos transgenicos por 15 anos mas",
              "SENASA publica nuevo reglamento para el registro de plaguicidas quimicos de uso agricola",
              "Presidente de Alianza Lima renuncia tras derrota en el clasico",
              "Minsa declara alerta sanitaria por dengue en Piura",
              "Rinden tributo a Chabuca Granda en su natalicio",
          ]
          for m in ms[:3]:
            for modo in ("lote", "uno_a_uno"):
              try:
                  t = time.time()
                  cfg = types.EmbedContentConfig(output_dimensionality=256)
                  if modo == "lote":
                      r = c.models.embed_content(model=m, contents=[perfil] + textos, config=cfg)
                      embs = r.embeddings
                  else:
                      embs = [c.models.embed_content(model=m, contents=x, config=cfg).embeddings[0] for x in [perfil] + textos]
                  print(f"RESULT {m} {modo} n_emb={len(embs)}")
                  v = np.array([e.values for e in embs], dtype=np.float32)
                  v /= np.linalg.norm(v, axis=1, keepdims=True)
                  sims = v[1:] @ v[0]
                  print(f"RESULT {m} {modo} dim={v.shape[1]} {time.time()-t:.1f}s sims=" + " | ".join(f"{s:.3f} {x[:35]}" for s, x in zip(sims, textos)))
              except Exception as e:
                  print(f"RESULT {m} {modo} FAIL {str(e)[:150]}")
          db = sqlite3.connect(":memory:"); db.enable_load_extension(True); sqlite_vec.load(db)
          print("RESULT sqlite-vec", db.execute("select vec_version()").fetchone())
          EOF
          python p.py
