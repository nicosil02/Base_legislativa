name: Backfill automatico (sesiones perdidas)

# Cierra el hueco de backfill-vod.yml (100% manual, alguien tiene que
# notar la sesion faltante y tipear el video_id a mano) - escanea SOLO
# el canal de YouTube del Congreso, encuentra sesiones reales (Pleno/
# comision) que sesiones_transcripciones todavia no tiene, y las
# recupera de a pocas por corrida: captions si ya estan listos (rapido),
# VOD completo + Whisper si no (lento, mismo camino que backfill-vod.yml
# manual). Ver congreso_live/backfill_auto.py para el por que completo -
# bug real 2026-09-18: 16 sesiones reales se encontraron y recuperaron
# a mano en una sola sesion de trabajo, varias de la semana en curso.
#
# Mismo esquema WARP que vigilar-congreso.yml/backfill-vod.yml (YouTube
# bloquea IPs de datacenter, WARP lo esquiva).
#
# El `schedule:` nativo de GitHub NO disparo confiable (bug real
# 2026-09-19: 25+ min de atraso sobre el primer horario esperado, mismo
# problema ya documentado en vigilar-congreso.yml a 10 min de frecuencia -
# ahi se arreglo con un pinger externo, pero acá Nicolas ya no tiene el
# token a mano). Se agrega el trigger `push` sobre data/.backfill_trigger
# como disparador real: una rutina programada en la nube (no este repo,
# ver Claude routines) solo actualiza ese archivo y hace push cada 6h -
# mismo mecanismo (git push) que ya usan de forma confiable las rutinas
# de "Resumir transcripciones"/"Redactar alertas", sin necesitar ningun
# token de GitHub nuevo. `schedule:` queda igual, por si algun dia se
# pone confiable solo.

on:
  push:
    paths:
      - 'data/.backfill_trigger'
  schedule:
    - cron: '20 */6 * * *'  # cada 6 horas - no confiable solo, ver comentario arriba
  workflow_dispatch:
    inputs:
      max:
        description: "Cuantas sesiones recuperar en esta corrida"
        required: false
        default: "4"

permissions:
  contents: write

# Grupo propio - no comparte cola con vigilar-congreso (dispara cada 10
# min, le ganaria la cola siempre) ni con backfill-vod (dispatch manual
# puntual, distinto uso).
concurrency:
  group: backfill-auto
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache pip + modelo Whisper (persiste entre runs)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: vigilar-congreso-deps-${{ hashFiles('.github/workflows/vigilar-congreso.yml') }}

      - name: Instalar deps
        run: |
          pip install -q yt-dlp requests faster-whisper "av<19" imageio-ffmpeg playwright
          # Chromium para listar las paginas de Facebook de las comisiones EC
          # (congreso_live/facebook_ec.py - yt-dlp no sabe listar paginas).
          python -m playwright install --with-deps chromium > /dev/null
          # Ver vigilar-congreso.yml: el binario portable de imageio-ffmpeg
          # crasheaba (SIGSEGV) en runners de GitHub Actions - el de apt
          # (probado para este mismo Ubuntu) no.
          sudo apt-get install -y -qq ffmpeg

      - name: Instalar Cloudflare WARP en modo proxy (SOCKS5 :40000)
        run: |
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloudflare-warp
          sudo systemctl enable --now warp-svc
          sleep 3
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000
          warp-cli --accept-tos connect
          sleep 5
          warp-cli --accept-tos status

      - name: Bootstrap DB Peru desde la rama datos
        run: bash scripts/bajar_db.sh proyectos.db.gz proyectos.db || true

      - name: Escanear canal y recuperar sesiones faltantes
        env:
          PYTHONIOENCODING: utf-8
          YT_DLP_PROXY: socks5://127.0.0.1:40000
          FFMPEG_BIN: /usr/bin/ffmpeg
        run: |
          # github.event.inputs.MAX (no el contexto `inputs` mas nuevo) -
          # evalua vacio de forma segura en triggers que no son
          # workflow_dispatch (ej. schedule), en vez de fallar la expresion.
          MAX="${{ github.event.inputs.max }}"
          if [ -z "$MAX" ]; then MAX=4; fi
          python -X utf8 -u -m congreso_live.cli backfill-auto \
              --max "$MAX" || echo "[warn] backfill-auto termino con error, sigo al commit igual"

      - name: Comisiones Asamblea EC (Facebook) - transcribir sesiones terminadas
        env:
          PYTHONIOENCODING: utf-8
          FFMPEG_BIN: /usr/bin/ffmpeg
        run: |
          # Sin YT_DLP_PROXY a proposito: Facebook no bloquea las IPs de
          # GitHub (verificado 2026-09-27, listado + audio directo OK), y asi
          # WARP queda solo para YouTube.
          timeout 9000 python -X utf8 -u -m congreso_live.cli comisiones-ec --max 3 \
              || echo "[warn] comisiones-ec termino con error, sigo al commit igual"

      - name: Publicar base en la rama datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # base_remota: la version publicada en `datos` es la base y se le
          # suman las transcripciones recuperadas aca (este workflow no es
          # dueño de PLs/agenda/noticias). Mismo merge que antes contra
          # origin/main, ahora sin versionar la base en main (ver
          # scripts/publicar_db.sh).
          bash scripts/publicar_db.sh base_remota proyectos.db
