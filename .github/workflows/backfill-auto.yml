name: Backfill automatico (sesiones perdidas)

# Version automatica de backfill-vod.yml: busca en el canal de YouTube del
# Congreso sesiones que sesiones_transcripciones no tiene y las recupera de a
# pocas (captions si estan listos, si no VOD + Whisper). Ver
# congreso_live/backfill_auto.py. Mismo esquema WARP que vigilar-congreso.yml.
#
# El cron nativo no dispara confiable: el disparador real es el push de
# data/.backfill_trigger que hace una rutina en la nube cada 6 h.

on:
  push:
    paths:
      - 'data/.backfill_trigger'
  schedule:
    - cron: '20 */6 * * *'  # cada 6 horas - no confiable solo, ver comentario arriba
  workflow_dispatch:
    inputs:
      max:
        description: "Cuantas sesiones recuperar en esta corrida"
        required: false
        default: "4"

permissions:
  contents: write

# Grupo propio: el de vigilar-congreso (cada 10 min) le ganaria la cola.
concurrency:
  group: backfill-auto
  cancel-in-progress: false


env:
  # Abre los datos cifrados de clientes (clientes/privado.py). Otro nombre que
  # GEMINI_API_KEY para no prender Gemini en pasos que no lo usan.
  CLIENTES_CLAVE: ${{ secrets.GEMINI_API_KEY }}

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache pip + modelo Whisper (persiste entre runs)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: vigilar-congreso-deps-${{ hashFiles('.github/workflows/vigilar-congreso.yml') }}

      - name: Instalar deps
        run: |
          pip install -q yt-dlp requests faster-whisper "av<19" imageio-ffmpeg playwright
          # Chromium para listar las paginas de Facebook de las comisiones EC
          # (congreso_live/facebook_ec.py - yt-dlp no sabe listar paginas).
          python -m playwright install --with-deps chromium > /dev/null
          # ffmpeg de apt: el portable de imageio-ffmpeg crasheaba (SIGSEGV).
          sudo apt-get install -y -qq ffmpeg

      - name: Instalar Cloudflare WARP en modo proxy (SOCKS5 :40000)
        run: |
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloudflare-warp
          sudo systemctl enable --now warp-svc
          sleep 3
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000
          warp-cli --accept-tos connect
          sleep 5
          warp-cli --accept-tos status

      - name: Bootstrap DB Peru desde la rama datos
        run: bash scripts/bajar_db.sh proyectos.db.gz proyectos.db || true

      - name: Escanear canal y recuperar sesiones faltantes
        env:
          PYTHONIOENCODING: utf-8
          YT_DLP_PROXY: socks5://127.0.0.1:40000
          FFMPEG_BIN: /usr/bin/ffmpeg
        run: |
          # github.event.inputs (no `inputs`): evalua vacio sin fallar fuera de dispatch.
          MAX="${{ github.event.inputs.max }}"
          if [ -z "$MAX" ]; then MAX=4; fi
          python -X utf8 -u -m congreso_live.cli backfill-auto \
              --max "$MAX" || echo "[warn] backfill-auto termino con error, sigo al commit igual"

      - name: Comisiones Asamblea EC (Facebook) - transcribir sesiones terminadas
        env:
          PYTHONIOENCODING: utf-8
          FFMPEG_BIN: /usr/bin/ffmpeg
        run: |
          # Sin YT_DLP_PROXY: Facebook no bloquea las IPs de GitHub; WARP queda
          # solo para YouTube.
          timeout 9000 python -X utf8 -u -m congreso_live.cli comisiones-ec --max 3 \
              || echo "[warn] comisiones-ec termino con error, sigo al commit igual"

      - name: Publicar base en la rama datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Solo la parte transcripciones (ver scripts/publicar_db.sh).
          bash scripts/publicar_db.sh proyectos.db transcripciones
