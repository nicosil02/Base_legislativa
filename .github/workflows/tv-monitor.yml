name: Monitor de TV y entrevistas (YouTube)

# Cada hora: busca entrevistas de autoridades subidas esta semana
# (noticias/videos.py) y lee los subtitulos de los programas de los canales
# de noticias PE/EC buscando menciones de valor (noticias/tv_monitor.py).
# Tambien dispara la escucha en vivo (tv-en-vivo.yml) a las 6 am y 9 pm Lima.
#
# Se encadena solo: cada corrida hace VUELTAS pasadas, una por hora, y al
# final se relanza (workflow_dispatch con GITHUB_TOKEN si dispara runs). El
# schedule de GitHub no disparo nunca las primeras horas (2026-09-28), igual
# que con backfill-auto.yml; queda solo como respaldo si la cadena se corta.

on:
  schedule:
    - cron: '35 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: tv-monitor
  cancel-in-progress: false

env:
  VUELTAS: 5

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar deps
        run: pip install -q yt-dlp requests

      - name: Instalar Cloudflare WARP en modo proxy (SOCKS5 :40000)
        run: |
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloudflare-warp
          sudo systemctl enable --now warp-svc
          sleep 3
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000
          warp-cli --accept-tos connect
          sleep 5
          warp-cli --accept-tos status

      - name: Bootstrap DB Peru desde la rama datos
        run: bash scripts/bajar_db.sh proyectos.db.gz proyectos.db || true

      - name: Pasadas horarias (entrevistas, menciones en TV, disparo de la escucha en vivo)
        env:
          PYTHONIOENCODING: utf-8
          YT_DLP_PROXY: socks5://127.0.0.1:40000
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in $(seq 1 "$VUELTAS"); do
            t0=$(date +%s)
            echo "=== vuelta $i $(TZ=America/Lima date '+%H:%M') Lima"
            # Escucha en vivo en las franjas de noticieros, si no hay una ya corriendo
            H=$(TZ=America/Lima date +%H)
            activos=$(gh run list --workflow=tv-en-vivo.yml -L 5 --json status --jq '[.[]|select(.status!="completed")]|length' || echo 1)
            if [ "$activos" = "0" ]; then
              if [ "$H" = "06" ] || [ "$H" = "21" ]; then
                gh workflow run tv-en-vivo.yml && echo "disparada tv-en-vivo (franja)"
              elif python -X utf8 -m noticias.tv_monitor hay-vivo-interes; then
                # fuera de franja: un directo de noticias con autoridad/entrevista en el titulo
                gh workflow run tv-en-vivo.yml -f minutos=60 && echo "disparada tv-en-vivo (vivo de interes)"
              fi
            fi
            python -X utf8 -u -m noticias.videos buscar proyectos.db || echo "[warn] busqueda de videos fallo"
            python -X utf8 -u -m noticias.tv_monitor escanear proyectos.db || echo "[warn] monitor de TV fallo"
            bash scripts/publicar_db.sh base_remota proyectos.db || echo "[warn] publicar fallo"
            if [ "$i" -lt "$VUELTAS" ]; then
              espera=$(( 3600 - ($(date +%s) - t0) ))
              [ "$espera" -gt 0 ] && sleep "$espera"
            fi
          done

      - name: Relanzar (cadena continua)
        if: success() || failure()  # si se cancela a mano, la cadena se corta
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run tv-monitor.yml
