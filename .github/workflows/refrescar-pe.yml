name: Actualizar Peru (PLs + snapshot)

on:
  # Respaldo del cron nativo (a veces no dispara): una rutina en la nube
  # toca data/.refrescar_trigger cada hora y ese push dispara esta corrida.
  push:
    paths: ['data/.refrescar_trigger']
  schedule:
    # Cada hora de 8 AM a 10 PM Lima (13-03 UTC).
    - cron: '0 0-3,13-23 * * *'
  workflow_dispatch:
    inputs:
      force_full_sync:
        description: 'Forzar sync completo (no incremental)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: refrescar-pe-${{ github.workflow }}
  cancel-in-progress: false


env:
  # Abre los datos cifrados de clientes (clientes/privado.py). Otro nombre que
  # GEMINI_API_KEY para no prender Gemini en pasos que no lo usan.
  CLIENTES_CLAVE: ${{ secrets.GEMINI_API_KEY }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determinar hora UTC real
        id: hora
        run: |
          # Hora UTC real (no github.event.schedule): vale tambien para corridas
          # por push o con cron atrasado. 10# evita que "08"/"09" se lean como octal.
          echo "hour=$((10#$(date -u +%H)))" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Cache de DB Peru (persiste entre runs)
        id: cache-db
        uses: actions/cache@v5
        with:
          path: proyectos.db
          key: pe-db-${{ github.run_id }}
          restore-keys: |
            pe-db-

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Instalar dependencias
        run: |
          python -m pip install -c constraints.txt --upgrade pip
          # sklearn y yt-dlp se importan a nivel de modulo en pasos que corren antes
          # (digest de noticias, alertas_pl). certifi al dia: el de la imagen del
          # runner no reconocia CAs intermedias nuevas (Cancilleria EC).
          pip install -c constraints.txt requests pycryptodome openpyxl pandas scikit-learn yt-dlp
          pip install -c constraints.txt --upgrade certifi

      - name: Instalar dependencias de noticias (PDF/OCR Registro Oficial EC)
        # Ventana por hora real (steps.hora), no el string exacto del cron:
        # el cron nativo puede disparar tarde.
        if: steps.hora.outputs.hour == '13' || steps.hora.outputs.hour == '14' || github.event_name == 'workflow_dispatch'
        run: |
          # Solo 8-9am Lima: el Registro Oficial EC sale 1x/dia.
          # paddlepaddle 3.2.2: 3.3.x rompe en CPU con oneDNN.
          pip install -c constraints.txt pymupdf pillow "paddlepaddle==3.2.2" paddleocr

      - name: Bootstrap DB Peru desde la rama datos (solo si no hay cache)
        if: hashFiles('proyectos.db') == ''
        run: |
          # La base vive en la rama `datos`, no en main (ver scripts/publicar_db.sh).
          bash scripts/bajar_db.sh proyectos.db.gz proyectos.db \
            || echo "[bootstrap] sin snapshot — la DB se construira desde cero (lento)"

      - name: Stats inicial
        run: |
          python -c "
          import sqlite3, os
          if not os.path.exists('proyectos.db'):
              print('[stats] sin DB todavia')
          else:
              c = sqlite3.connect('proyectos.db')
              total = c.execute('SELECT COUNT(*) FROM proyectos').fetchone()[0]
              print(f'[stats inicial] proyectos={total}')
          "

      - name: Sync incremental
        env:
          FORCE_FULL: ${{ inputs.force_full_sync }}
        run: |
          # Normalmente <2 min. FORCE_FULL=true (dispatch) re-fetchea el detalle
          # de todos los PLs.
          FLAG=""
          if [ "$FORCE_FULL" = "true" ]; then FLAG="--full"; fi
          timeout 2400 python -m scraper.cli update $FLAG || echo "[warn] sync PE timeout — sigo con DB actual"

      - name: Alertar cambios de estado en PLs de interes (matrices de cliente)
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: |
          # Justo despues del sync para leer el estado mas fresco
          # (ver clientes/alertas_pl.py).
          python -X utf8 -m clientes.alertas_pl check || echo "[warn] alertas_pl fallo, sigo"

      - name: Refrescar catalogo de comisiones (limpia basura)
        run: |
          # Re-baja el catalogo desde la API del Congreso PE. Filtra entradas
          # Re-baja el catalogo y filtra entradas basura; idempotente.
          python -X utf8 -m scraper.cli refresh-comisiones || echo "[warn] refresh-comisiones fallo, sigo"

      - name: Actualizar agenda de sesiones (PE)
        run: |
          # Periodo 2026-2031 (bicameral). --periodo-leg all: sin el solo se
          # sincroniza un periodo legislativo y se pierden los demas.
          timeout 1200 python -X utf8 -m sesiones.cli update --periodo-par 2026 --periodo-leg all || echo "[warn] sesiones sync fallo, sigo"

      - name: Actualizar agendas del Pleno (PE)
        run: |
          # API adp-portal-service, ambos periodos, incremental.
          timeout 900 python -X utf8 -m pleno.cli update || echo "[warn] pleno sync fallo, sigo"
          # Esa API no tiene agendas del periodo bicameral: las camaras las
          # publican como PDF en su sitio, y eso lo cubre pleno.agenda_pdf.
          timeout 300 python -X utf8 -m pleno.agenda_pdf sync || echo "[warn] pleno agenda_pdf fallo, sigo"
          # Votaciones nominales y asistencias del Pleno (PDF de texto; los
          # escaneados se cuentan y se saltan). Lee tambien las URL que
          # agenda_pdf guardo (provisionales que la web despues reemplaza).
          timeout 300 python -X utf8 -m votaciones.pleno_bicameral sync || echo "[warn] votaciones pleno fallo, sigo"

      - name: Actualizar mesas de trabajo + eventos del Congreso PE
        run: |
          # 1) RSS feed: captura los ultimos posts publicados con URL real
          #    (para tener el enlace al post individual completo)
          timeout 300 python -X utf8 -m mesas_tecnicas.cli sync --pages 5 \
              || echo "[warn] mesas_tecnicas sync RSS fallo, sigo"
          # 2) Listado por dia (14 atras, 21 adelante) con la hora real.
          timeout 300 python -X utf8 -m mesas_tecnicas.cli sync-dias \
              --days-back 14 --days-fwd 21 \
              || echo "[warn] mesas_tecnicas sync-dias fallo, sigo"

      - name: Actualizar noticias y coyuntura (PE + EC)
        env:
          HOUR: ${{ steps.hora.outputs.hour }}
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Fuentes de noticias en cada corrida. Registro Oficial EC (PDF/OCR)
          # solo en la ventana 8-9am Lima o dispatch: sale 1x/dia.
          RO_FLAG=""
          if [ "$HOUR" = "13" ] || [ "$HOUR" = "14" ] || [ "$IS_DISPATCH" = "true" ]; then
            RO_FLAG="--con-ro-ec"
          fi
          timeout 600 python -X utf8 -m noticias.cli seed \
              || echo "[warn] noticias seed fallo, sigo"
          timeout 600 python -X utf8 -m noticias.cli sync $RO_FLAG \
              || echo "[warn] noticias sync fallo, sigo"
          # Digest de WhatsApp en 2 horarios fijos (9-10am y 2-3pm Lima). Ventana
          # de 2 h, no minuto exacto: tolera cron atrasado y corridas por push.
          if [ "$HOUR" -ge 14 ] && [ "$HOUR" -le 15 ]; then
            timeout 120 python -X utf8 -m noticias.cli avisar \
                || echo "[warn] noticias avisar fallo, sigo"
          elif [ "$HOUR" -ge 19 ] && [ "$HOUR" -le 20 ]; then
            timeout 120 python -X utf8 -m noticias.cli avisar \
                || echo "[warn] noticias avisar fallo, sigo"
          elif [ "$IS_DISPATCH" = "true" ]; then
            timeout 120 python -X utf8 -m noticias.cli avisar \
                || echo "[warn] noticias avisar fallo, sigo"
          else
            echo "[avisar] fuera de los horarios fijos (9-10am/2-3pm Lima) - skip"
          fi
          # sync solo re-toca lo mas reciente; esto repara fecha_pub NULL
          # visitando el articulo (--limit acota el tiempo por corrida).
          timeout 300 python -X utf8 -m noticias.cli backfill-fechas --limit 300 \
              || echo "[warn] noticias backfill-fechas fallo, sigo"
          # Antes de la purga: anota la ultima noticia de cada fuente y avisa
          # por Telegram las que llevan 7+ dias sin traer nada.
          timeout 60 python -X utf8 -m noticias.fuentes_caidas \
              || echo "[warn] fuentes caidas fallo, sigo"
          # Purge: la UI muestra por defecto solo "hoy"; conservamos 7d
          # como buffer historico para evitar que la DB crezca infinito.
          timeout 120 python -X utf8 -m noticias.cli purge --dias 7 \
              || echo "[warn] noticias purge fallo, sigo"
          # Aviso del Anexo 1 Foc R4T (Agrocalidad); se apaga el 2026-12-31.
          timeout 120 python -X utf8 scripts/vigilar_anexo_foc.py \
              || echo "[warn] vigilar_anexo_foc fallo, sigo"
          # Aviso de la compra de medicinas a India (AIL EP); se apaga el 2026-12-31.
          timeout 120 python -X utf8 scripts/vigilar_medicinas_india.py \
              || echo "[warn] vigilar_medicinas_india fallo, sigo"

      - name: Instalar Cloudflare WARP en modo proxy (SOCKS5 :40000)
        # Ventana por hora real (steps.hora), no el string exacto del cron:
        # el cron nativo puede disparar tarde.
        if: steps.hora.outputs.hour == '13' || steps.hora.outputs.hour == '14' || github.event_name == 'workflow_dispatch'
        # Si WARP no conecta el paso queda en rojo (lo ve sistema/salud.py)
        # y la corrida sigue con lo que no depende de YouTube.
        continue-on-error: true
        run: bash scripts/warp.sh

      - name: Puente SOCKS5->HTTP para descargas de captions (privoxy :8118)
        # Ventana por hora real (steps.hora), no el string exacto del cron:
        # el cron nativo puede disparar tarde.
        if: steps.hora.outputs.hour == '13' || steps.hora.outputs.hour == '14' || github.event_name == 'workflow_dispatch'
        run: |
          # Los captions se bajan con urllib, que respeta http_proxy pero no
          # habla SOCKS5: privoxy hace de puente.
          sudo apt-get install -y -qq privoxy
          echo "forward-socks5 / 127.0.0.1:40000 ." | sudo tee -a /etc/privoxy/config
          sudo systemctl restart privoxy
          sleep 2
          curl -s -x http://127.0.0.1:8118 -o /dev/null -w "privoxy->WARP HTTP %{http_code}\n" https://www.youtube.com/

      - name: Transcripciones de sesiones (captions YouTube, Pleno/comisiones)
        # Ventana por hora real (steps.hora), no el string exacto del cron:
        # el cron nativo puede disparar tarde.
        if: steps.hora.outputs.hour == '13' || steps.hora.outputs.hour == '14' || github.event_name == 'workflow_dispatch'
        env:
          YT_DLP_PROXY: socks5://127.0.0.1:40000
          http_proxy: http://127.0.0.1:8118
          https_proxy: http://127.0.0.1:8118
        run: |
          # Los captions tardan dias en procesarse: alcanza 1x/dia.
          pip install -c constraints.txt -q yt-dlp
          # --max 60: con 25 comisiones reconocidas, 20 streams no alcanzaban.
          timeout 300 python -X utf8 -m congreso_live.cli sync-transcripciones --max 60 \
              || echo "[warn] sync-transcripciones fallo, sigo"

      - name: Reclasificar PLs en "Otros" con alta confianza
        run: |
          # Usa el modelo entrenado en models/clasificador_pe.joblib
          # (re-entrenado weekly por entrenar-ml.yml). Aplica a PLs en
          # "Otros" con confianza >= 0.85 → cambio automatico. Confianza
          # 0.70-0.85 → sugerencia pendiente. ~10 seg.
          pip install -c constraints.txt -q scikit-learn joblib
          python -X utf8 -m clasificador.cli reclassify --apply || echo "[warn] reclassify fallo, sigo"

      - name: Aplicar decisiones de reclasificacion (aceptar/rechazar desde la app)
        run: |
          # La app no puede escribir proyectos.db: registra las decisiones en
          # data/clasificador_decisiones.json y este paso las aplica.
          python -X utf8 -m clasificador.cli aplicar-decisiones || echo "[warn] aplicar-decisiones fallo, sigo"

      - name: Reclasificar temas de transcripciones con el resumen limpio
        run: |
          # Usa el resumen limpio (data/transcripciones_resumenes.json), no la
          # transcripcion cruda, que da falsos positivos por nombres y cortesias.
          if [ -f proyectos.db ]; then
            python -X utf8 -m congreso_live.reclasificar_temas run || echo "[warn] reclasificar_temas fallo, sigo"
          fi

      - name: Envio de alerta diaria (am/pm)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          ALERT_RECIPIENT: ${{ secrets.ALERT_RECIPIENT }}
          PYTHONIOENCODING: utf-8
          HOUR: ${{ steps.hora.outputs.hour }}
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          # 2 horarios fijos (ver alerts/cli.py), con ventana de 2 h por cron
          # atrasado; alerts/cli.py deduplica por dia y slot.
          if [ -z "$RESEND_API_KEY" ]; then
            echo "[alert-backup] sin RESEND_API_KEY, skip"
          elif [ "$HOUR" -ge 14 ] && [ "$HOUR" -le 15 ]; then
            python -X utf8 -m alerts.cli send --slot am || echo "[warn] alert send (am) fallo, sigo"
          elif [ "$HOUR" -ge 19 ] && [ "$HOUR" -le 20 ]; then
            python -X utf8 -m alerts.cli send --slot pm || echo "[warn] alert send (pm) fallo, sigo"
          elif [ "$IS_DISPATCH" = "true" ]; then
            python -X utf8 -m alerts.cli send --slot manual || echo "[warn] alert send (manual) fallo, sigo"
          else
            echo "[alert-backup] fuera de los horarios fijos (9-10am/2-3pm Lima) - skip"
          fi

      - name: Heartbeats (registra corrida exitosa)
        run: |
          # La UI muestra "actualizado hace X min" desde esta tabla.
          python -X utf8 -m sistema.heartbeat --db proyectos.db --source pe_proyectos
          python -X utf8 -m sistema.heartbeat --db proyectos.db --source pe_sesiones
          python -X utf8 -m sistema.heartbeat --db proyectos.db --source pe_pleno || echo "[warn] heartbeat pleno fallo"

      - name: Stats final
        run: |
          python -c "
          import sqlite3, datetime
          c = sqlite3.connect('proyectos.db')
          total = c.execute('SELECT COUNT(*) FROM proyectos').fetchone()[0]
          comis = c.execute('SELECT COUNT(*) FROM comisiones').fetchone()[0]
          hoy = datetime.date.today().isoformat()
          # Sesiones (puede no existir si nunca corrio sesiones init)
          try:
              sesiones = c.execute('SELECT COUNT(*) FROM sesiones').fetchone()[0]
              futuras = c.execute('SELECT COUNT(*) FROM sesiones WHERE fecha >= ?', (hoy,)).fetchone()[0]
              max_fecha = c.execute('SELECT MAX(fecha) FROM sesiones').fetchone()[0]
              print(f'[stats] proyectos={total} comisiones={comis} sesiones={sesiones} futuras={futuras} max_fecha={max_fecha}')
          except sqlite3.OperationalError:
              print(f'[stats] proyectos={total} comisiones={comis} (sin tablas sesiones todavia)')
          try:
              pleno = c.execute('SELECT COUNT(*) FROM pleno_sesiones').fetchone()[0]
              pleno_pls = c.execute('SELECT COUNT(*) FROM pleno_pl_referenciado').fetchone()[0]
              print(f'[stats] pleno_agendas={pleno} pleno_refs_pl={pleno_pls}')
          except sqlite3.OperationalError:
              print('[stats] (sin tablas pleno todavia — el primer sync las creara)')
          "

      - name: Publicar base en la rama datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # La base va a la rama `datos` (un commit sin historial), no a main.
          # Mezcla transcripciones de otros workflows y reintenta si otro publico.
          bash scripts/publicar_db.sh proyectos.db base transcripciones votaciones

      - name: Auto-commit snapshot si cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `git add` de una ruta inexistente es fatal; el JSON de decisiones
          # solo existe despues del primer uso.
          git add data/pl_seguimiento_estado.json
          [ -f data/clasificador_decisiones.json ] && git add data/clasificador_decisiones.json
          if git diff --staged --quiet; then
            echo "Sin cambios en el snapshot PE."
            exit 0
          fi
          git commit -m "PE: auto-refresh PLs $(date -u +%Y-%m-%d-%H%M) [skip ci]"
          # Aca solo van los JSON chicos de estado (la base va a `datos`).
          # Reintento por pushes concurrentes de otros workflows.
          for i in 1 2 3; do
            if git push; then
              echo "Push OK (intento $i)"
              exit 0
            fi
            echo "Push fallo (intento $i), reintentando sobre origin/main..."
            git fetch origin main
            # Salvar los JSON de estado: el reset --hard los pisaria.
            [ -f data/pl_seguimiento_estado.json ] && cp data/pl_seguimiento_estado.json /tmp/estado_pl.json
            [ -f data/clasificador_decisiones.json ] && cp data/clasificador_decisiones.json /tmp/clasificador_decisiones.json
            # --hard, no --soft: --soft revertia archivos cambiados en origin.
            git reset --hard origin/main
            [ -f /tmp/estado_pl.json ] && mv -f /tmp/estado_pl.json data/pl_seguimiento_estado.json
            [ -f /tmp/clasificador_decisiones.json ] && mv -f /tmp/clasificador_decisiones.json data/clasificador_decisiones.json
            git add data/pl_seguimiento_estado.json
            [ -f data/clasificador_decisiones.json ] && git add data/clasificador_decisiones.json
            if git diff --staged --quiet; then
              echo "Ya esta en origin/main tras el merge, nada que commitear."
              exit 0
            fi
            git commit -m "PE: auto-refresh PLs $(date -u +%Y-%m-%d-%H%M) [skip ci]"
            sleep 5
          done
          echo "Push fallo despues de 3 intentos."
          exit 1
