name: Actualizar Peru (PLs + snapshot)

on:
  schedule:
    # Cada hora durante horas habiles 8 AM - 22 PM Lima (13-03 UTC),
    # mas corrida nocturna a las 6 AM Lima (11 UTC) para catch-up.
    # 15 runs/dia x ~2 min = 30 min/dia = 900 min/mes (45% del free tier).
    # Da actualizacion casi real-time durante horas de actividad legislativa.
    - cron: '0 13 * * *'  # 8 AM Lima
    - cron: '0 14 * * *'  # 9 AM
    - cron: '0 15 * * *'  # 10 AM
    - cron: '0 16 * * *'  # 11 AM
    - cron: '0 17 * * *'  # 12 PM
    - cron: '0 18 * * *'  # 1 PM
    - cron: '0 19 * * *'  # 2 PM
    - cron: '0 20 * * *'  # 3 PM
    - cron: '0 21 * * *'  # 4 PM
    - cron: '0 22 * * *'  # 5 PM
    - cron: '0 23 * * *'  # 6 PM
    - cron: '0 0 * * *'   # 7 PM
    - cron: '0 1 * * *'   # 8 PM
    - cron: '0 2 * * *'   # 9 PM
    - cron: '0 3 * * *'   # 10 PM (corrida principal nocturna)
  workflow_dispatch:
    inputs:
      force_full_sync:
        description: 'Forzar sync completo (no incremental)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: refrescar-pe-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Cache de DB Peru (persiste entre runs)
        id: cache-db
        uses: actions/cache@v5
        with:
          path: proyectos.db
          key: pe-db-${{ github.run_id }}
          restore-keys: |
            pe-db-

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests pycryptodome openpyxl pandas

      - name: Bootstrap DB Peru desde snapshot gz (solo si no hay cache)
        if: hashFiles('proyectos.db') == ''
        run: |
          if [ -f data/proyectos.db.gz ]; then
            echo "[bootstrap] descomprimiendo data/proyectos.db.gz"
            gunzip -kc data/proyectos.db.gz > proyectos.db
            ls -lh proyectos.db
          else
            echo "[bootstrap] sin snapshot — la DB se construira desde cero (lento)"
          fi

      - name: Stats inicial
        run: |
          python -c "
          import sqlite3, os
          if not os.path.exists('proyectos.db'):
              print('[stats] sin DB todavia')
          else:
              c = sqlite3.connect('proyectos.db')
              total = c.execute('SELECT COUNT(*) FROM proyectos').fetchone()[0]
              print(f'[stats inicial] proyectos={total}')
          "

      - name: Sync incremental
        run: |
          # Timeout 40 min (margen para sync completo si por algun motivo
          # se quedo desfasado). Normalmente termina en <2 min.
          timeout 2400 python -m scraper.cli update || echo "[warn] sync PE timeout — sigo con DB actual"

      - name: Refrescar catalogo de comisiones (limpia basura)
        run: |
          # Re-baja el catalogo desde la API del Congreso PE. Filtra entradas
          # basura (tests tipo "cremas al tetra") usando blacklist + heuristica.
          # Rapido (~3 seg), idempotente. Solo agrega/actualiza, no borra
          # comisiones legitimas.
          python -X utf8 -m scraper.cli refresh-comisiones || echo "[warn] refresh-comisiones fallo, sigo"

      - name: Actualizar agenda de sesiones (PE)
        run: |
          # Bug encontrado: el modulo sesiones/ existe pero NINGUN workflow lo
          # corria, por eso la agenda de comisiones del Congreso PE no se
          # actualizaba. Lo integramos aca para que corra 4x/dia junto con
          # el sync de proyectos. Sync incremental (~30 seg).
          timeout 600 python -X utf8 -m sesiones.cli update || echo "[warn] sesiones sync fallo, sigo"

      - name: Reclasificar PLs en "Otros" con alta confianza
        run: |
          # Usa el modelo entrenado en models/clasificador_pe.joblib
          # (re-entrenado weekly por entrenar-ml.yml). Aplica a PLs en
          # "Otros" con confianza >= 0.85 → cambio automatico. Confianza
          # 0.70-0.85 → sugerencia pendiente. ~10 seg.
          pip install -q scikit-learn joblib
          python -X utf8 -m clasificador.cli reclassify --apply || echo "[warn] reclassify fallo, sigo"

      - name: Envio de alerta diaria (backup del daily-alerts.yml)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          ALERT_RECIPIENT: ${{ secrets.ALERT_RECIPIENT }}
          PYTHONIOENCODING: utf-8
        run: |
          # Backup confiable del workflow daily-alerts.yml — sus crones tienen
          # latencias muy variables (>3h en GitHub Actions). Este workflow
          # corre 4x/dia con timing mas consistente. Si la alerta ya se envio
          # hoy (slot=09, slot=10 o slot=cron), alerts.cli skip via
          # already_sent_today. Si no, envia.
          if [ -z "$RESEND_API_KEY" ]; then
            echo "[alert-backup] sin RESEND_API_KEY, skip"
          else
            python -X utf8 -m alerts.cli send --slot cron || echo "[warn] alert send fallo, sigo"
          fi

      - name: Heartbeats (registra corrida exitosa)
        run: |
          # Registra que el workflow corrio (independiente de si hubo
          # cambios en los datos). La UI lee de esta tabla para mostrar
          # "actualizado hace X min" — refleja salud del workflow, no
          # actividad del Congreso.
          python -X utf8 -m sistema.heartbeat --db proyectos.db --source pe_proyectos
          python -X utf8 -m sistema.heartbeat --db proyectos.db --source pe_sesiones

      - name: Stats final
        run: |
          python -c "
          import sqlite3, datetime
          c = sqlite3.connect('proyectos.db')
          total = c.execute('SELECT COUNT(*) FROM proyectos').fetchone()[0]
          comis = c.execute('SELECT COUNT(*) FROM comisiones').fetchone()[0]
          hoy = datetime.date.today().isoformat()
          # Sesiones (puede no existir si nunca corrio sesiones init)
          try:
              sesiones = c.execute('SELECT COUNT(*) FROM sesiones').fetchone()[0]
              futuras = c.execute('SELECT COUNT(*) FROM sesiones WHERE fecha >= ?', (hoy,)).fetchone()[0]
              max_fecha = c.execute('SELECT MAX(fecha) FROM sesiones').fetchone()[0]
              print(f'[stats] proyectos={total} comisiones={comis} sesiones={sesiones} futuras={futuras} max_fecha={max_fecha}')
          except sqlite3.OperationalError:
              print(f'[stats] proyectos={total} comisiones={comis} (sin tablas sesiones todavia)')
          "

      - name: Generar snapshot gz
        run: |
          # Comprimir con gzip -9 para minimizar tamano del .gz en el repo.
          # -k mantiene el .db original para que el cache de la proxima corrida
          # lo encuentre.
          gzip -9kf proyectos.db
          mv proyectos.db.gz data/proyectos.db.gz
          ls -lh data/proyectos.db.gz

      - name: Auto-commit snapshot si cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/proyectos.db.gz
          if git diff --staged --quiet; then
            echo "Sin cambios en el snapshot PE."
            exit 0
          fi
          git commit -m "PE: auto-refresh PLs $(date -u +%Y-%m-%d-%H%M) [skip ci]"
          # Retry-on-conflict: el workflow de Ecuador puede pushear en
          # paralelo y dejar nuestro push outdated. Rebaseamos y reintentamos.
          for i in 1 2 3; do
            if git push; then
              echo "Push OK (intento $i)"
              exit 0
            fi
            echo "Push fallo (intento $i), rebaseando con origin/main..."
            git fetch origin main
            git rebase -X theirs origin/main || {
              echo "Rebase fallo, abortando intento $i"
              git rebase --abort
              sleep 5
            }
          done
          echo "Push fallo despues de 3 intentos."
          exit 1
