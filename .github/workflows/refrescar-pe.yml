name: Actualizar Peru (PLs + snapshot)

on:
  schedule:
    # Cada hora durante horas habiles 8 AM - 22 PM Lima (13-03 UTC),
    # mas corrida nocturna a las 6 AM Lima (11 UTC) para catch-up.
    # 15 runs/dia x ~2 min = 30 min/dia = 900 min/mes (45% del free tier).
    # Da actualizacion casi real-time durante horas de actividad legislativa.
    - cron: '0 13 * * *'  # 8 AM Lima
    - cron: '0 14 * * *'  # 9 AM
    - cron: '0 15 * * *'  # 10 AM
    - cron: '0 16 * * *'  # 11 AM
    - cron: '0 17 * * *'  # 12 PM
    - cron: '0 18 * * *'  # 1 PM
    - cron: '0 19 * * *'  # 2 PM
    - cron: '0 20 * * *'  # 3 PM
    - cron: '0 21 * * *'  # 4 PM
    - cron: '0 22 * * *'  # 5 PM
    - cron: '0 23 * * *'  # 6 PM
    - cron: '0 0 * * *'   # 7 PM
    - cron: '0 1 * * *'   # 8 PM
    - cron: '0 2 * * *'   # 9 PM
    - cron: '0 3 * * *'   # 10 PM (corrida principal nocturna)
  workflow_dispatch:
    inputs:
      force_full_sync:
        description: 'Forzar sync completo (no incremental)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: refrescar-pe-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Cache de DB Peru (persiste entre runs)
        id: cache-db
        uses: actions/cache@v5
        with:
          path: proyectos.db
          key: pe-db-${{ github.run_id }}
          restore-keys: |
            pe-db-

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          # scikit-learn: bug real 2026-09-19 - noticias/digest.py lo
          # importa a nivel de modulo (TfidfVectorizer/cosine_similarity),
          # pero solo se instalaba mas abajo en el paso "Reclasificar PLs"
          # (que corre DESPUES de noticias.cli avisar). Cada corrida desde
          # que se armo el digest (2026-09-17) crasheaba en silencio con
          # "ModuleNotFoundError: No module named 'sklearn'" - el digest de
          # WhatsApp de noticias PE/EC (y el match de PL de interes de
          # Ecuador) nunca llego a mandar nada.
          # yt-dlp: mismo patron que scikit-learn arriba - bug real
          # 2026-09-19. clientes/alertas_pl.py solo necesita
          # _find_db_path() (un simple resolvedor de ruta), pero esa
          # funcion vive en congreso_live/transcripciones.py, que tiene
          # `import yt_dlp` a nivel de modulo (lo usa OTRA funcion del
          # mismo archivo, no _find_db_path) - yt-dlp recien se instalaba
          # mas abajo, para el paso de transcripciones con WARP, demasiado
          # tarde para el paso de alertas_pl que corre antes. La alerta de
          # PL de Bayer nunca llego a chequear nada desde que se armo.
          #
          # certifi: bug real 2026-09-20 encontrado auditando fuentes activas
          # sin ninguna noticia jamas - Cancilleria EC (cancilleria.gob.ec,
          # fuente real y activa, verificado con curl y con nuestro propio
          # fetch_fuente() desde otra red: 200 OK, feed real con items
          # recientes) fallaba SIEMPRE en este runner con
          # "SSLCertVerificationError: unable to get local issuer
          # certificate" - tanto la sesion con cloudscraper como el fallback
          # plano de _get() (pensado para OTRO problema, el fingerprint TLS
          # de cloudscraper) fallaban igual, porque el certificado real
          # (CA real Sectigo, no autofirmado) usa una CA intermedia mas
          # nueva que el certifi ya cacheado en la imagen del runner no
          # reconoce. Actualizar certifi es inofensivo (solo agrega
          # confianza a CAs reales, nunca la reduce) y deberia resolver esto
          # para cualquier sitio con el mismo patron, no solo Cancilleria.
          pip install requests pycryptodome openpyxl pandas scikit-learn yt-dlp
          pip install --upgrade certifi

      - name: Instalar dependencias de noticias (PDF/OCR Registro Oficial EC)
        if: github.event.schedule == '0 13 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          # Solo se instala en la corrida de las 8 AM Lima (ver "Actualizar
          # noticias" mas abajo) - no hace falta pagar este costo 15x/dia
          # cuando las ediciones del Registro Oficial EC salen 1x/dia.
          pip install pymupdf pytesseract pillow
          # tesseract-ocr NO viene preinstalado en el runner ubuntu-latest
          # (confirmado contra actions/runner-images, 2026-09-12).
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa

      - name: Bootstrap DB Peru desde snapshot gz (solo si no hay cache)
        if: hashFiles('proyectos.db') == ''
        run: |
          if [ -f data/proyectos.db.gz ]; then
            echo "[bootstrap] descomprimiendo data/proyectos.db.gz"
            gunzip -kc data/proyectos.db.gz > proyectos.db
            ls -lh proyectos.db
          else
            echo "[bootstrap] sin snapshot — la DB se construira desde cero (lento)"
          fi

      - name: Stats inicial
        run: |
          python -c "
          import sqlite3, os
          if not os.path.exists('proyectos.db'):
              print('[stats] sin DB todavia')
          else:
              c = sqlite3.connect('proyectos.db')
              total = c.execute('SELECT COUNT(*) FROM proyectos').fetchone()[0]
              print(f'[stats inicial] proyectos={total}')
          "

      - name: Sync incremental
        env:
          FORCE_FULL: ${{ inputs.force_full_sync }}
        run: |
          # Timeout 40 min (margen para sync completo si por algun motivo
          # se quedo desfasado). Normalmente termina en <2 min.
          # FORCE_FULL=true (dispatch manual) agrega --full: re-fetchea el
          # detalle de TODOS los PLs, no solo los nuevos/cambiados. Antes
          # este input existia pero no se usaba en ningun lado (bug).
          FLAG=""
          if [ "$FORCE_FULL" = "true" ]; then FLAG="--full"; fi
          timeout 2400 python -m scraper.cli update $FLAG || echo "[warn] sync PE timeout — sigo con DB actual"

      - name: Alertar cambios de estado en PLs de interes (matrices de cliente)
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          PYTHONIOENCODING: utf-8
        run: |
          # Justo despues del sync de PLs (arriba) para leer el estado
          # mas fresco posible. Solo Bayer/Peru por ahora - ver
          # clientes/alertas_pl.py. data/pl_seguimiento_estado.json se
          # commitea igual que el resto del estado compartido (paso
          # final "Auto-commit snapshot").
          python -X utf8 -m clientes.alertas_pl check || echo "[warn] alertas_pl fallo, sigo"

      - name: Refrescar catalogo de comisiones (limpia basura)
        run: |
          # Re-baja el catalogo desde la API del Congreso PE. Filtra entradas
          # basura (tests tipo "cremas al tetra") usando blacklist + heuristica.
          # Rapido (~3 seg), idempotente. Solo agrega/actualiza, no borra
          # comisiones legitimas.
          python -X utf8 -m scraper.cli refresh-comisiones || echo "[warn] refresh-comisiones fallo, sigo"

      - name: Actualizar agenda de sesiones (PE)
        run: |
          # --periodo-par 2026 = periodo parlamentario 2026-2031 (Congreso
          # bicameral vigente desde 2026-07-27). --periodo-leg all itera los
          # 5 periodos legislativos de ese parlamento (2026..2030) — sin
          # `all`, por default solo se sincroniza UN periodo legislativo y
          # se pierden los demas (ya nos paso una vez con el periodo 2021,
          # perdiendo ~1500 sesiones historicas de 2023-2024).
          # Hasta 2026-09-10 este workflow sincronizaba el periodo 2021-2026
          # (unicameral, ya cerrado) — corregido para seguir al Congreso real.
          # Sync incremental: solo re-pega detalles si el estado cambio.
          timeout 1200 python -X utf8 -m sesiones.cli update --periodo-par 2026 --periodo-leg all || echo "[warn] sesiones sync fallo, sigo"

      - name: Actualizar agendas del Pleno (PE)
        run: |
          # Sync de agendas del Pleno via API adp-portal-service. Cobertura de
          # AMBOS periodos: 2021-2026 (historico, unicameral, ~180 agendas) y
          # 2026-2031 (vigente, bicameral — al 2026-09-11 todavia sin agendas
          # publicadas por esta API, pero se recogen solas apenas aparezcan).
          # Sync incremental: solo re-pega detalles si cambio el titulo/url.
          # Primera corrida ~5 min (fetchea detalle de cada agenda); las
          # siguientes son rapidas (~30 seg) porque solo procesa la del
          # jueves nuevo + cualquier actualizacion.
          timeout 900 python -X utf8 -m pleno.cli update --periodo 2021-2026,2026-2031 || echo "[warn] pleno sync fallo, sigo"
          # La API de arriba SIGUE sin agendas del periodo bicameral
          # (verificado en vivo 2026-09-15, igual que el 09-11) - el
          # Congreso bicameral las publica como PDF en el sitio propio de
          # cada camara, no por esa API. pleno.agenda_pdf cubre ese
          # backfill scrapeando senado.congreso.gob.pe y
          # diputados.congreso.gob.pe directamente.
          timeout 300 python -X utf8 -m pleno.agenda_pdf sync || echo "[warn] pleno agenda_pdf fallo, sigo"

      - name: Actualizar mesas de trabajo + eventos del Congreso PE
        run: |
          # 1) RSS feed: captura los ultimos posts publicados con URL real
          #    (para tener el enlace al post individual completo)
          timeout 300 python -X utf8 -m mesas_tecnicas.cli sync --pages 5 \
              || echo "[warn] mesas_tecnicas sync RSS fallo, sigo"
          # 2) Listado por dia: itera /agenda/YYYY/M/D/ para los ultimos
          #    14 dias y 21 dias futuros, capturando HORA real de cada
          #    evento. Reemplaza el approach con date input JS que no
          #    funcionaba. ~30 seg.
          timeout 300 python -X utf8 -m mesas_tecnicas.cli sync-dias \
              --days-back 14 --days-fwd 21 \
              || echo "[warn] mesas_tecnicas sync-dias fallo, sigo"

      - name: Actualizar noticias y coyuntura (PE + EC)
        env:
          SCHEDULE: ${{ github.event.schedule }}
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: |
          # Seed idempotente del catalogo de fuentes + sync RSS de los
          # ~84 medios/instituciones/gremios mapeados. Captura noticias
          # de Coyuntura Politica, Instituciones, Salud, Tech, Agrarios,
          # KYC/AML - esto SIGUE corriendo cada corrida (15x/dia), como
          # antes.
          #
          # Registro Oficial EC (indice + PDF/OCR de ediciones y
          # suplementos) es distinto: publica 1x/dia, asi que --con-ro-ec
          # solo se agrega en la corrida de las 8 AM Lima o en dispatch
          # manual - no tiene sentido re-bajar/re-OCRear los mismos PDFs
          # 15 veces al dia.
          RO_FLAG=""
          if [ "$SCHEDULE" = "0 13 * * *" ] || [ "$IS_DISPATCH" = "true" ]; then
            RO_FLAG="--con-ro-ec"
          fi
          timeout 600 python -X utf8 -m noticias.cli seed \
              || echo "[warn] noticias seed fallo, sigo"
          timeout 600 python -X utf8 -m noticias.cli sync $RO_FLAG \
              || echo "[warn] noticias sync fallo, sigo"
          # Digest por WhatsApp de lo nuevo y relevante (PE+EC), agrupando
          # cobertura duplicada del mismo evento - ver noticias/digest.py.
          # Redisenado 2026-09-20 (Nicolas: "las alertas... me llegan muy
          # seguido... a veces no me dice nada" + "debería llegar 2 veces
          # al día, 1 a las 8-9am y otra a las 2pm"): antes disparaba en
          # cada corrida (15x/dia) y solo mandaba algo si habia contenido -
          # silencio ambiguo el resto de las veces. Ahora SOLO corre en
          # los 2 horarios fijos (9am/2pm Lima) o en dispatch manual, y
          # noticias/digest.py::run() siempre manda algo (aunque sea "sin
          # novedades") en esos 2 horarios - las corridas intermedias
          # siguen sincronizando datos igual, solo no vuelven a avisar.
          if [ "$SCHEDULE" = "0 14 * * *" ] || [ "$SCHEDULE" = "0 19 * * *" ] || [ "$IS_DISPATCH" = "true" ]; then
            timeout 120 python -X utf8 -m noticias.cli avisar \
                || echo "[warn] noticias avisar fallo, sigo"
          else
            echo "[avisar] fuera de los horarios fijos (9am/2pm Lima) - skip"
          fi
          # Backfill de fechas: sync solo re-toca los items MAS RECIENTES
          # por fuente, asi que una fila que quedo con fecha_pub NULL (fix
          # de codigo posterior a su insercion, o fuente sin <time> en su
          # listado) nunca se corrige sola - esto la repara visitando el
          # articulo real. --limit 300 acota el tiempo por corrida (se
          # pusieron al dia 676 filas reales en ~90s en pruebas locales,
          # 2026-09-13); si quedan mas de 300 nuevas de una sola vez, las
          # sig. corridas (15x/dia) van completando el resto.
          timeout 300 python -X utf8 -m noticias.cli backfill-fechas --limit 300 \
              || echo "[warn] noticias backfill-fechas fallo, sigo"
          # Purge: la UI muestra por defecto solo "hoy"; conservamos 7d
          # como buffer historico para evitar que la DB crezca infinito.
          timeout 120 python -X utf8 -m noticias.cli purge --dias 7 \
              || echo "[warn] noticias purge fallo, sigo"

      - name: Instalar Cloudflare WARP en modo proxy (SOCKS5 :40000)
        if: github.event.schedule == '0 13 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          # Mismo fix que vigilar-congreso.yml, verificado en vivo
          # 2026-09-15: YouTube bloquea las IPs de datacenter de GitHub
          # Actions ("Sign in to confirm you're not a bot") por reputacion
          # de IP, no por falta de token - bgutil-ytdlp-pot-provider (PO
          # Token) NO lo esquiva (verificado 2026-09-14, run #1775, mismo
          # error con el token activo). Tunelizar por Cloudflare WARP SI
          # funciona. Antes este paso no tenia WARP, asi que
          # sync-transcripciones fallaba SIEMPRE en silencio (el
          # "|| echo [warn]... sigo" se comia el error) - por eso ninguna
          # sesion ya terminada tenia transcripcion via captions, pese a
          # correr "exitosamente" 1x/dia.
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloudflare-warp
          sudo systemctl enable --now warp-svc
          sleep 3
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000
          warp-cli --accept-tos connect
          sleep 5
          warp-cli --accept-tos status

      - name: Puente SOCKS5->HTTP para descargas de captions (privoxy :8118)
        if: github.event.schedule == '0 13 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          # obtener_transcripcion() baja el VTT de los captions con
          # urllib.request directo (no yt-dlp) - urllib SI respeta
          # http_proxy/https_proxy del entorno automaticamente (sin
          # tocar codigo), pero necesita HTTP, no SOCKS5. privoxy hace
          # de puente igual que en vigilar-congreso.yml.
          sudo apt-get install -y -qq privoxy
          echo "forward-socks5 / 127.0.0.1:40000 ." | sudo tee -a /etc/privoxy/config
          sudo systemctl restart privoxy
          sleep 2
          curl -s -x http://127.0.0.1:8118 -o /dev/null -w "privoxy->WARP HTTP %{http_code}\n" https://www.youtube.com/

      - name: Transcripciones de sesiones (captions YouTube, Pleno/comisiones)
        if: github.event.schedule == '0 13 * * *' || github.event_name == 'workflow_dispatch'
        env:
          YT_DLP_PROXY: socks5://127.0.0.1:40000
          http_proxy: http://127.0.0.1:8118
          https_proxy: http://127.0.0.1:8118
        run: |
          # Igual que Registro Oficial EC arriba: los captions de YouTube
          # tardan dias en procesarse (verificado en vivo 2026-09-14), asi
          # que no tiene sentido chequear 15x/dia - alcanza con la corrida
          # de las 8 AM Lima o dispatch manual.
          pip install -q yt-dlp
          # --max 60 (antes 20): con el fix de clasificacion de hoy
          # (congreso_live/detector.py, 25 comisiones reales en vez de
          # 17) aparecieron muchas sesiones que antes ni se reconocian -
          # verificado en vivo 2026-09-16, 20 se clasifican dentro de los
          # ultimos 40 streams del canal, 20 no alcanzaba (--max 20 =
          # n=20 crudos = solo 11 clasificados). 60 da margen para el
          # catch-up de hoy y para el uso normal de ahi en mas.
          timeout 300 python -X utf8 -m congreso_live.cli sync-transcripciones --max 60 \
              || echo "[warn] sync-transcripciones fallo, sigo"

      - name: Reclasificar PLs en "Otros" con alta confianza
        run: |
          # Usa el modelo entrenado en models/clasificador_pe.joblib
          # (re-entrenado weekly por entrenar-ml.yml). Aplica a PLs en
          # "Otros" con confianza >= 0.85 → cambio automatico. Confianza
          # 0.70-0.85 → sugerencia pendiente. ~10 seg.
          pip install -q scikit-learn joblib
          python -X utf8 -m clasificador.cli reclassify --apply || echo "[warn] reclassify fallo, sigo"

      - name: Aplicar decisiones de reclasificacion (aceptar/rechazar desde la app)
        run: |
          # Gap real encontrado 2026-09-21: 246 sugerencias de
          # clasificacion_sugerencias llevaban meses acumulandose sin
          # forma de revisarlas. pages/1_Peru.py ahora las muestra y dejar
          # que Nicolas decida, pero esa pagina abre proyectos.db en modo
          # READ-ONLY (y ese archivo local en Streamlit Cloud es efimero
          # de todas formas) - no puede escribir la decision ahi. Solo
          # REGISTRA la decision en data/clasificador_decisiones.json (via
          # la API de GitHub, mismo patron que alerts/borradores_store.py)
          # y este paso, que SI tiene el proyectos.db real, es quien
          # aplica de verdad tema/estado y limpia el JSON de pendientes.
          python -X utf8 -m clasificador.cli aplicar-decisiones || echo "[warn] aplicar-decisiones fallo, sigo"

      - name: Reclasificar temas de transcripciones con el resumen limpio
        run: |
          # Bug real 2026-09-15 (feedback de Nicolas: "estas clasificando
          # mal por temas las sesiones de comisiones"): sesiones_transcripciones.
          # temas se calculaba con noticias.temas.clasificar() sobre la
          # TRANSCRIPCION CRUDA, que tiene cortesias protocolares
          # ("senor diputado", en TODA sesion) y nombres de parlamentarios
          # que a veces coinciden con keywords cortos - verificado con una
          # sesion de Salud que citaba a la diputada "Ana Luisa Yufra
          # Lugo" y quedaba mal clasificada como "Crop" (ANA = Autoridad
          # Nacional del Agua). Ya se saco esa keyword ambigua de
          # noticias/temas.py, pero ademas: la rutina horaria de resumenes
          # (NO puede tocar proyectos.db, es de solo lectura para ella)
          # ya deja un resumen limpio y sintetizado en
          # data/transcripciones_resumenes.json - este paso SI puede
          # reclasificar usando ESE texto en vez de la transcripcion
          # cruda, mucho menos propenso a este tipo de falso positivo.
          if [ -f proyectos.db ]; then
            python -X utf8 -m congreso_live.reclasificar_temas run || echo "[warn] reclasificar_temas fallo, sigo"
          fi

      - name: Envio de alerta diaria (backup del daily-alerts.yml)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          ALERT_RECIPIENT: ${{ secrets.ALERT_RECIPIENT }}
          PYTHONIOENCODING: utf-8
          SCHEDULE: ${{ github.event.schedule }}
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          # Redisenado 2026-09-20 (mismo pedido que el digest de WhatsApp
          # arriba: 2 horarios fijos por dia, 9am y 2pm Lima, en vez de
          # 1x/dia con retry). Ver alerts/cli.py para la logica completa -
          # cada slot SIEMPRE envia (con o sin contenido) salvo que ya se
          # haya mandado ese slot especifico hoy.
          if [ -z "$RESEND_API_KEY" ]; then
            echo "[alert-backup] sin RESEND_API_KEY, skip"
          elif [ "$SCHEDULE" = "0 14 * * *" ]; then
            python -X utf8 -m alerts.cli send --slot am || echo "[warn] alert send (am) fallo, sigo"
          elif [ "$SCHEDULE" = "0 19 * * *" ]; then
            python -X utf8 -m alerts.cli send --slot pm || echo "[warn] alert send (pm) fallo, sigo"
          elif [ "$IS_DISPATCH" = "true" ]; then
            python -X utf8 -m alerts.cli send --slot manual || echo "[warn] alert send (manual) fallo, sigo"
          else
            echo "[alert-backup] fuera de los horarios fijos (9am/2pm Lima) - skip"
          fi

      - name: Heartbeats (registra corrida exitosa)
        run: |
          # Registra que el workflow corrio (independiente de si hubo
          # cambios en los datos). La UI lee de esta tabla para mostrar
          # "actualizado hace X min" — refleja salud del workflow, no
          # actividad del Congreso.
          python -X utf8 -m sistema.heartbeat --db proyectos.db --source pe_proyectos
          python -X utf8 -m sistema.heartbeat --db proyectos.db --source pe_sesiones
          python -X utf8 -m sistema.heartbeat --db proyectos.db --source pe_pleno || echo "[warn] heartbeat pleno fallo"

      - name: Stats final
        run: |
          python -c "
          import sqlite3, datetime
          c = sqlite3.connect('proyectos.db')
          total = c.execute('SELECT COUNT(*) FROM proyectos').fetchone()[0]
          comis = c.execute('SELECT COUNT(*) FROM comisiones').fetchone()[0]
          hoy = datetime.date.today().isoformat()
          # Sesiones (puede no existir si nunca corrio sesiones init)
          try:
              sesiones = c.execute('SELECT COUNT(*) FROM sesiones').fetchone()[0]
              futuras = c.execute('SELECT COUNT(*) FROM sesiones WHERE fecha >= ?', (hoy,)).fetchone()[0]
              max_fecha = c.execute('SELECT MAX(fecha) FROM sesiones').fetchone()[0]
              print(f'[stats] proyectos={total} comisiones={comis} sesiones={sesiones} futuras={futuras} max_fecha={max_fecha}')
          except sqlite3.OperationalError:
              print(f'[stats] proyectos={total} comisiones={comis} (sin tablas sesiones todavia)')
          try:
              pleno = c.execute('SELECT COUNT(*) FROM pleno_sesiones').fetchone()[0]
              pleno_pls = c.execute('SELECT COUNT(*) FROM pleno_pl_referenciado').fetchone()[0]
              print(f'[stats] pleno_agendas={pleno} pleno_refs_pl={pleno_pls}')
          except sqlite3.OperationalError:
              print('[stats] (sin tablas pleno todavia — el primer sync las creara)')
          "

      - name: Generar snapshot gz
        run: |
          # Mergear SIEMPRE sesiones_transcripciones de origin antes de
          # generar el snapshot - bug real 2026-09-15: este workflow usa
          # actions/cache para proyectos.db (restore-keys generico entre
          # corridas), asi que cuando el cache trae una copia VIEJA, el
          # push despues sale limpio (la ancestria del commit sigue
          # siendo valida, git no mira contenido) y el fallback de merge
          # por conflicto nunca se dispara - piso en silencio transcripciones
          # reales que vigilar-congreso.yml/backfill-vod.yml habian
          # guardado mientras el cache estaba desactualizado (paso 2 veces
          # el mismo dia: Presupuesto/Transportes borrados asi).
          git fetch origin main 2>/dev/null || true
          if git show origin/main:data/proyectos.db.gz > /tmp/origin_proyectos.db.gz 2>/dev/null \
              && [ -s /tmp/origin_proyectos.db.gz ]; then
            gunzip -c /tmp/origin_proyectos.db.gz > /tmp/origin_proyectos.db
            python -X utf8 -m congreso_live.merge_db proyectos.db /tmp/origin_proyectos.db
          fi
          # Comprimir con gzip -9 para minimizar tamano del .gz en el repo.
          # -k mantiene el .db original para que el cache de la proxima corrida
          # lo encuentre.
          gzip -9nkf proyectos.db
          mv proyectos.db.gz data/proyectos.db.gz
          ls -lh data/proyectos.db.gz

      - name: Auto-commit snapshot si cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/proyectos.db.gz data/pl_seguimiento_estado.json data/clasificador_decisiones.json
          if git diff --staged --quiet; then
            echo "Sin cambios en el snapshot PE."
            exit 0
          fi
          git commit -m "PE: auto-refresh PLs $(date -u +%Y-%m-%d-%H%M) [skip ci]"
          # Retry-on-conflict: otros workflows (vigilar-congreso.yml,
          # backfill-vod.yml, y el de Ecuador) pueden pushear en paralelo y
          # dejar nuestro push outdated. Bug real 2026-09-15: "rebase -X
          # theirs" descarta el archivo binario COMPLETO de un lado -
          # asi se borraron transcripciones en vivo reales (Presupuesto/
          # Transportes) que vigilar-congreso.yml habia guardado segundos
          # antes. Fix: si el conflicto es en data/proyectos.db.gz,
          # mergear sesiones_transcripciones a nivel de filas SQL
          # (merge_db.py) antes de reintentar - proyectos.db (local) SI
          # tiene siempre la ultima version real de las tablas que este
          # workflow es dueño (PLs/agenda/etc), asi que se usa como base.
          for i in 1 2 3; do
            if git push; then
              echo "Push OK (intento $i)"
              exit 0
            fi
            echo "Push fallo (intento $i), mergeando con origin/main..."
            git fetch origin main
            MERGED=""
            if [ -f proyectos.db ] && git show origin/main:data/proyectos.db.gz > /tmp/origin_proyectos.db.gz 2>/dev/null \
                && [ -s /tmp/origin_proyectos.db.gz ]; then
              gunzip -c /tmp/origin_proyectos.db.gz > /tmp/origin_proyectos.db
              python -X utf8 -m congreso_live.merge_db proyectos.db /tmp/origin_proyectos.db
              gzip -9nkf proyectos.db
              mv -f proyectos.db.gz /tmp/merged_proyectos.db.gz
              MERGED=1
            fi
            # data/pl_seguimiento_estado.json (clientes/alertas_pl.py) y
            # data/clasificador_decisiones.json (clasificador/decisiones_store.py)
            # son OTROS archivos aparte de proyectos.db.gz - el --hard de
            # abajo los pisaria con la version vieja de origin igual que el
            # bug real 2026-09-16 de mas abajo, asi que se salvan aparte
            # antes del reset.
            [ -f data/pl_seguimiento_estado.json ] && cp data/pl_seguimiento_estado.json /tmp/estado_pl.json
            [ -f data/clasificador_decisiones.json ] && cp data/clasificador_decisiones.json /tmp/clasificador_decisiones.json
            # --hard, no --soft: bug real 2026-09-16 (backfill-vod.yml #7) -
            # con --soft el index se queda con la base vieja del checkout y
            # el commit revierte sin querer cualquier OTRO archivo que haya
            # cambiado en origin mientras corria el job (en #7 reverti 3
            # workflows .yml; solo lo freno el permiso "workflows" de GH).
            # --hard sincroniza todo con origin primero.
            git reset --hard origin/main
            if [ -n "$MERGED" ]; then
              mv -f /tmp/merged_proyectos.db.gz data/proyectos.db.gz
            fi
            [ -f /tmp/estado_pl.json ] && mv -f /tmp/estado_pl.json data/pl_seguimiento_estado.json
            [ -f /tmp/clasificador_decisiones.json ] && mv -f /tmp/clasificador_decisiones.json data/clasificador_decisiones.json
            git add data/proyectos.db.gz data/pl_seguimiento_estado.json data/clasificador_decisiones.json
            if git diff --staged --quiet; then
              echo "Ya esta en origin/main tras el merge, nada que commitear."
              exit 0
            fi
            git commit -m "PE: auto-refresh PLs $(date -u +%Y-%m-%d-%H%M) [skip ci]"
            sleep 5
          done
          echo "Push fallo despues de 3 intentos."
          exit 1
